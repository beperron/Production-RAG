lso_answered_by": ["MCR 7.104(D)", "MCR 7.104(E)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "needs_revision", "echo": 0.105, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "The provision correctly answers the timing question (7 days from the entry of the order granting leave), but it does not define what the required acts actually are, making MCR 7.104(D) and (E) highly relevant co-valid answers that should be retrieved alongside it.", "provision": "(b) the appellant must complete the acts required by MCR 7.104(D) and (E) within 7 days after the entry of the order granting leave to appeal, and"}, {"query_id": "mcr-q-B-MCR3.230(A)(2)(a)", "query": "My client&#x27;s support case is being handled by the county office that handles support and paternity establishment. When I draft my motion, what is the proper label to use for that agency so the court knows what I&#x27;m referring to?", "query_previous": "I&#x27;m handling a paternity action and the proposed order references a county office handling support enforcement — what&#x27;s the defined term for that entity under the summary support rules?", "citation": "MCR 3.230(A)(2)(a)", "gold": ["MCR 3.230(A)(2)(a)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.278, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Fault not repaired: it is still the same circumlocution (&#x27;what is the proper label to use for that agency&#x27;) and it now describes the agency in the definition&#x27;s own words -- &#x27;handles support and paternity establishment&#x27; tracks &#x27;provides support and paternity establishment services&#x27; verbatim.", "provision": "(a) “IV-D agency” means the agency in a county that provides support and paternity establishment services under MCL 722.1501."}, {"query_id": "mcr-q-B-MCR2.105(L)(1)", "query": "I&#x27;m reviewing a filing rule that says I have to use a postal method with tracking and a signature card, but my clerk tells me the cheaper option with tracking and a signature card is acceptable instead. If I use that cheaper option, what proof must the post office stamp before I rely on it to prove I met the mailing requirement?", "query_previous": "If I send the summons via certified mail with a return receipt instead of using the other postal method, is there anything specific I need to make sure the postal service does to the mailing receipt?", "citation": "MCR 2.105(L)(1)", "gold": ["MCR 2.105(L)(1)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.16, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "The summons-specific premise that triggered MCR 2.105(L)(2) is gone, but the replacement is incoherent: both the required method and the &#x27;cheaper option&#x27; are described identically as &#x27;tracking and a signature card&#x27;, and no attorney refers to registered/certified mail that way.", "provision": "(1) If a rule uses the term “registered mail,” that term includes the term “certified mail,” and the term “registered mail, return receipt requested” includes the term “certified mail, return receipt requested.” However, if certified mail is used, the receipt of mailing must be postmarked by the post office."}, {"query_id": "mcr-q-B-MCR3.920(B)(2)(c)", "query": "In a personal protection order enforcement proceeding against a juvenile, the summons has to go out to the youth, but I also need to serve a parent or guardian — is there a carve-out if we can&#x27;t locate them after a good-faith search?", "query_previous": "For a PPO enforcement hearing where the accused is under eighteen, who has to get handed the papers besides the kid himself, and is there an exception if we can&#x27;t track down the adults?", "citation": "MCR 3.920(B)(2)(c)", "gold": ["MCR 3.920(B)(2)(c)"], "also_answered_by": ["MCR 3.983(C)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.476, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Fault not repaired: MCR 3.983(C) still answers the same minor-PPO-enforcement question (serve the respondent plus parent/guardian/custodian only where addresses are known or ascertainable on diligent inquiry) and remains unmarked; it should be co-gold.", "provision": "(c) In a personal protection order enforcement proceeding involving a minor respondent, a summons must be served on the minor. A summons must also be served on the parent or parents, guardian, or legal custodian, unless their whereabouts remain unknown after a diligent inquiry."}, {"query_id": "mcr-q-A-MCR6.417", "query": "Judge in a criminal trial has signaled he&#x27;s about to declare a mistrial. Do the parties get heard on that first, and does my client&#x27;s position have to be stated on the record?", "query_previous": null, "citation": "MCR 6.417", "gold": ["MCR 6.417"], "also_answered_by": ["MCR 2.507"], "query_type": "cross_reference", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.125, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "Before ordering a mistrial, the court must, on the record, give each defendant and the prosecutor an opportunity to comment on the propriety of the order, to state whether that party consents or objects, and to suggest alternatives."}, {"query_id": "mcr-q-A-MCR3.811", "query": "Stepparent adoption set for finalization and my petitioners have since relocated to Arizona. Does the judge have authority to let them appear remotely by video for that hearing, or does she need something beyond the court rules to do it?", "query_previous": "Adoption finalization and the petitioners live out of state. Can they appear by video, and which videoconferencing standards apply to an adoption hearing?", "citation": "MCR 3.811", "gold": ["MCR 3.811"], "also_answered_by": ["MCR 3.801"], "query_type": "disambiguation", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.053, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "MCR 3.811 explicitly incorporates MCR 2.407 by reference for the standards governing videoconferencing, so a reader cannot fully answer the question regarding the judge&#x27;s authority and requirements without consulting MCR 2.407.", "provision": "Except as otherwise provided, the court may allow the use of videoconferencing technology for proceedings under this subchapter in accordance with MCR 2.407."}, {"query_id": "mcr-q-A-MCR3.717", "query": "My client filed the extreme risk petition and now wants out before the judge decides anything. Can she just withdraw it, and is there a charge for the motion?", "query_previous": null, "citation": "MCR 3.717", "gold": ["MCR 3.717"], "also_answered_by": ["MCR 3.716"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.214, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "Except as specified in MCR 3.718(B), MCR 3.718(D), and MCR 3.720, an action for an extreme risk protection order may only be dismissed upon motion by the petitioner prior to the issuance of an order. There is no fee for such a motion. This rule does not preclude a dismissal as otherwise permitted by law."}, {"query_id": "mcr-q-B-MCR2.403(H)(5)(b)", "query": "My client&#x27;s case evaluation got postponed, and we already paid the evaluation fee, but the postponement was granted well after the hearing was originally supposed to happen. What&#x27;s the strict timing cutoff for when the adjournment had to be granted in order for us to still get our fee back, and is there a way to save the refund if we missed that window?", "query_previous": "If the parties want to push back the case evaluation date, by when does the court actually need to grant that delay, and is there any exception if they blow that deadline?", "citation": "MCR 2.403(H)(5)(b)", "gold": ["MCR 2.403(H)(5)(b)"], "also_answered_by": ["MCR 2.403(H)(5)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.115, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "claude", "checker_note": "The leaf carries no polarity; only the stem MCR 2.403(H)(5) says fees &#x27;shall not be refunded&#x27; if this condition is met, so from the leaf alone a reader would get the refund answer backwards.", "provision": "(b) the request for and granting of adjournment is made within 14 days of the scheduled case evaluation, unless waived for good cause."}, {"query_id": "mcr-q-B-MCR7.209(F)(2)(e)", "query": "My client filed a delayed application for leave to appeal his conviction in the Court of Appeals, and the panel released him on bond pending decision. He just got a job offer in Ohio. Can he take the work, or does he need the panel&#x27;s sign-off first?", "query_previous": "My client posted bond for release pending appeal. He just got a job offer in Ohio. Can he take the work, or does he need the judge&#x27;s sign-off first?", "citation": "MCR 7.209(F)(2)(e)", "gold": ["MCR 7.209(F)(2)(e)"], "also_answered_by": ["MCR 7.108(C)(2)(e)"], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.087, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "claude", "checker_note": "", "provision": "(e) to remain in Michigan unless the court gives written approval to leave; and"}, {"query_id": "mcr-q-A-MCR2.116(G)(1)(c)", "query": "County still runs on paper. Does chambers need its own copy of my dispositive motion brief and affidavits, and how does it have to be marked?", "query_previous": null, "citation": "MCR 2.116(G)(1)(c)", "gold": ["MCR 2.116(G)(1)(c)"], "also_answered_by": ["MCR 2.119(A)(2)(d)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.385, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(c) Except where electronic filing has been implemented, a copy of a motion, response (including brief and any affidavits), or reply brief filed under this rule must be provided by counsel to the office of the judge hearing the motion. The judge&#x27;s copy must be clearly marked JUDGE&#x27;S COPY on the cover sheet; that notation may be handwritten. Where electronic filing has been implemented, a judge’s copy shall not be required."}, {"query_id": "mcr-q-A-MCR7.119(B)(2)(a)", "query": "Taking a licensing agency&#x27;s final decision up to circuit court under the administrative procedures act. Is the appeal paper in the same form as any other circuit court appeal, or does it depart from that?", "query_previous": null, "citation": "MCR 7.119(B)(2)(a)", "gold": ["MCR 7.119(B)(2)(a)"], "also_answered_by": ["MCR 7.104(C)(1)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.125, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(a) Claim of Appeal - Form. The claim of appeal shall conform with the requirements of MCR 7.104(C)(1), except that:"}, {"query_id": "mcr-q-A-MCR9.130(A)", "query": "Fee dispute with a former client and we&#x27;re both willing to let the grievance administrator arbitrate it. What has to be in place first, and where does the award get filed?", "query_previous": null, "citation": "MCR 9.130(A)", "gold": ["MCR 9.130(A)"], "also_answered_by": ["MCR 3.602", "MCR 8.122"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.429, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(A) Arbitration. On written agreement between an attorney and his or her client, the administrator or an attorney the administrator assigns may arbitrate a dispute and enter an award in accordance with the arbitration laws. Except as otherwise provided by this subrule, the arbitration is governed by MCR 3.602. The award and a motion for entry of an order or judgment must be filed in the court having jurisdiction under MCR 8.122. If the award recommends discipline of the attorney, it must also be treated as a request for investigation."}, {"query_id": "mcr-q-A-MCR1.105", "query": "Opposing counsel wants my client&#x27;s case tossed over a technical slip that hurt nobody. Is there a general provision about how the rules are supposed to be applied that I can lead with?", "query_previous": null, "citation": "MCR 1.105", "gold": ["MCR 1.105"], "also_answered_by": ["MCR 2.116"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.056, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "These rules are to be construed, administered, and employed by the parties and the court to secure the just, speedy, and economical determination of every action and to avoid the consequences of error that does not affect the substantial rights of the parties."}, {"query_id": "mcr-q-A-MCR2.626", "query": "Fee petition question. Can I bill the hours my paralegal put in on substantive work, and does she have to meet any qualification standard?", "query_previous": null, "citation": "MCR 2.626", "gold": ["MCR 2.626"], "also_answered_by": ["MCR 2.615"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "An award of attorney fees may include an award for the time and labor of any legal assistant who contributed nonclerical, legal support under the supervision of an attorney, provided the legal assistant meets the criteria set forth in Article 1, § 6 of the Bylaws of the State Bar of Michigan."}, {"query_id": "mcr-q-A-MCR3.907(E)(2)", "query": "Juvenile disposition is set for three weeks out. Probation emailed the assessment scoring and its supervision recommendation to me, my client, and the prosecutor, but nothing was ever put into the court file. Prosecutor says circulating it to counsel is all that&#x27;s required. Is emailing it around to the parties enough, or does the packet itself have to be lodged with the court?", "query_previous": "Juvenile dispositional hearing is set. Do the assessment results and the recommendation go to the prosecutor and defense too, and how far ahead?", "citation": "MCR 3.907(E)(2)", "gold": ["MCR 3.907(E)(2)"], "also_answered_by": ["MCR 3.922(B)(4)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.133, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(2) Reporting. The results of the risk and needs assessment along with a written dispositional recommendation must be filed with the court and provided to the juvenile, juvenile’s attorney, and prosecuting attorney no less than 7 days before the dispositional hearing as provided in MCR 3.922(B)(4). The written recommendation must include all of the following:"}, {"query_id": "mcr-q-A-MCR8.117", "query": "Complaint pleads breach of contract and also asks to quiet title. Do I put two case-type codes on it or one, what do I pick from, and does it have to ride along on everything I file after the complaint?", "query_previous": null, "citation": "MCR 8.117", "gold": ["MCR 8.117"], "also_answered_by": ["MCR 1.109(D)(1)(b)(iii)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.111, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "Use of Case-Type Code. As required by MCR 1.109(D)(1)(b)(iii), the person filing a case initiating document must assign one case-type code from a list provided by the State Court Administrator according to the principal subject matter of the action (not the nature of the proceedings), and shall provide this code with other case initiation information required by MCR 1.109(D)(2). The case code must be included in the caption of all other documents filed in the case."}, {"query_id": "mcr-q-A-MCR4.304(A)", "query": "Small claims trial and both sides are present. Can a party take part remotely by video, and what does the court need to push the trial to a later date?", "query_previous": null, "citation": "MCR 4.304(A)", "gold": ["MCR 4.304(A)"], "also_answered_by": ["MCR 2.407"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.25, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(A) Appearance. If the parties appear, the court shall hear the claim as provided in MCL 600.8411. In accordance with MCR 2.407, the court may allow the use of videoconferencing technology by any participant as defined in MCR 2.407(A)(1). The trial may be adjourned to a later date for good cause."}, {"query_id": "mcr-q-A-MCR3.721(C)", "query": "Contempt proceeding pending for violating an extreme risk order and we think the guns are still at the house. Can we get a warrant, and can the judge refuse if probable cause is shown?", "query_previous": null, "citation": "MCR 3.721(C)", "gold": ["MCR 3.721(C)"], "also_answered_by": ["MCR 3.719(D)(2)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.176, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(C) Search Warrant. If the violation alleges that the respondent has a firearm or concealed pistol license in the respondent’s possession or control, a law enforcement officer or prosecuting attorney may also file an affidavit requesting that the court issue a search warrant to search the location or locations where the firearm(s) or concealed pistol license is believed to be and to seize any firearm(s) or concealed pistol license discovered during the search. The law enforcement officer’s affidavit may include affirmative allegations contained in the complaint. If the affidavit establishes probable cause to believe the location or locations to be searched are places where the firearm(s) or concealed pistol license is believed to be, the court must issue the search warrant."}, {"query_id": "mcr-q-A-MCR3.979(F)(6)(a)", "query": "Juvenile guardian petitioned to be let out of the appointment, court agrees it is best for the child to end it, and nobody has come forward to take her place. Does the court handle the disposition on the same track it would use if the department had moved to undo the guardianship outright, or is there a separate disposition for a guardian who asks out?", "query_previous": "Court is ending a juvenile guardian&#x27;s appointment and nobody has been lined up to take over. Where does the case go from there?", "citation": "MCR 3.979(F)(6)(a)", "gold": ["MCR 3.979(F)(6)(a)"], "also_answered_by": ["MCR 3.979(F)(5)"], "query_type": "cross_reference", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.042, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "The cited provision merely cross-references subrule (F)(5) for the disposition procedure, meaning the actual answer to the question&#x27;s procedural track lies in MCR 3.979(F)(5), not the labeled text.", "provision": "(a) no successor, the court shall proceed according to subrule (F)(5); or"}, {"query_id": "mcr-q-A-MCR3.722(B)(1)(b)", "query": "Judge extended my client&#x27;s extreme risk protection order after a contested hearing. Is that an appeal of right, or do I need to ask for leave because it wasn&#x27;t the original order?", "query_previous": null, "citation": "MCR 3.722(B)(1)(b)", "gold": ["MCR 3.722(B)(1)(b)"], "also_answered_by": ["MCR 3.722(B)(1)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.412, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(b) an order granting or denying an extended extreme risk protection order after a hearing under MCR 3.720(B)."}, {"query_id": "mcr-q-A-MCR5.125(C)(6)(f)", "query": "Trustee is presenting an account on a living trust that the settlor can still revoke. Who has to be given notice -- the settlor, or the people who would take when he dies?", "query_previous": null, "citation": "MCR 5.125(C)(6)(f)", "gold": ["MCR 5.125(C)(6)(f)"], "also_answered_by": ["MCR 5.125(C)(6)(g)"], "query_type": "disambiguation", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.385, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(f) for a revocable trust, the settlor (and if the petitioner has a reasonable basis to believe the settlor is an incapacitated individual, those persons who are entitled to be reasonably informed, as referred to in MCL 700.7603[2]), the current trustee, and any other person named in the terms of the trust to receive either an account or a notice of such a proceeding, including a trust director,"}, {"query_id": "mcr-q-A-MCR9.128(D)", "query": "Attorney never paid what the discipline order assessed and the board has now mailed out a certified notice of the nonpayment. Does he get a hearing before he loses his ticket, how fast does it take effect, and can he head it off by proposing to pay it over time?", "query_previous": "Lawyer got suspended purely for not paying the costs assessed against him in a discipline case. Does he still have to send the client notifications and file proof of compliance that any other suspended attorney does?", "citation": "MCR 9.128(D)", "gold": ["MCR 9.128(D)"], "also_answered_by": ["MCR 9.119"], "query_type": "cross_reference", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.227, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(D) Automatic Suspension for Nonpayment. The respondent will be suspended automatically, effective 7 days from the mailing of the certified notice of nonpayment, and until the respondent pays the costs assessed or the board approves a suitable plan for payment. The board shall file a notice of suspension with the clerk of the Supreme Court and the State Bar of Michigan. A copy must be served on the respondent and the administrator. A respondent who is suspended for nonpayment of costs under this rule is required to comply with the requirements imposed by MCR 9.119 on suspended attorneys."}, {"query_id": "mcr-q-A-MCR2.302(G)(1)", "query": "Our answers to interrogatories are ready. Client is represented -- can he sign them himself, or does a lawyer of record have to?", "query_previous": null, "citation": "MCR 2.302(G)(1)", "gold": ["MCR 2.302(G)(1)"], "also_answered_by": ["MCR 1.109(E)(2)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.3, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(1) In addition to any other signature required by these rules, every disclosure under MCR 2.302(A), every request for discovery, and every response or objection to such a request made by a party represented by an attorney shall be signed by at least one attorney of record. A party who is not represented by an attorney must sign the disclosure, request, response, or objection."}, {"query_id": "mcr-q-A-MCR2.119(C)(2)(b)", "query": "My opposition brief is finished and I&#x27;m sending a runner to hand it to opposing counsel at his office rather than mailing it. Counting back from the hearing date, what is the latest day that hand-off can happen?", "query_previous": "Putting in a brief opposing a motion and serving it through the e-filing system. How many days ahead of the hearing does it have to go out?", "citation": "MCR 2.119(C)(2)(b)", "gold": ["MCR 2.119(C)(2)(b)"], "also_answered_by": ["MCR 1.109(G)(6)(b)", "MCR 2.107(C)(1)", "MCR 2.107(C)(2)", "MCR 2.107(C)(3)", "MCR 2.119(C)(2)(a)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.056, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(b) at least 3 days before the hearing, if served by delivery under MCR 2.107(C)(1) or (2) or MCR 1.109(G)(6)(a)."}, {"query_id": "mcr-q-B-MCR1.109(G)(3)(i)(i)", "query": "My client can&#x27;t e-file due to a medical condition and we&#x27;re submitting the paperwork to opt out. Do I need to pay a filing fee to get that waiver processed, and does it have to be sworn?", "query_previous": null, "citation": "MCR 1.109(G)(3)(i)(i)", "gold": ["MCR 1.109(G)(3)(i)(i)"], "also_answered_by": ["MCR 1.109(D)(3)"], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.143, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "claude", "checker_note": "", "provision": "(i) The request for an exemption must be on a form approved by the State Court Administrative Office, must specify the reasons that prevent the individual from filing electronically, and be verified under MCR 1.109(D)(3). The individual may file supporting documents along with the request for the court’s consideration. There is no fee for the request."}, {"query_id": "mcr-q-B-MCR3.604(I)(2)", "query": "We&#x27;re set to pursue a bond forfeiture ruling. Do I have to track down the guarantor&#x27;s current physical whereabouts, or is it enough to send the paperwork to the contact info they put down when the undertaking was issued?", "query_previous": null, "citation": "MCR 3.604(I)(2)", "gold": ["MCR 3.604(I)(2)"], "also_answered_by": ["MCR 2.107"], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.05, "regenerated": null, "review_stratum": "co-gold-claimed", "checker": "claude", "checker_note": "", "provision": "(2) Notice. Notice of the hearing on the motion for judgment must be given to the surety or the owner of the security in the manner prescribed in MCR 2.107. The notice may be mailed to the address stated in the bond or stated when the security was furnished unless the surety or owner has given notice of a change of address."}, {"query_id": "mcr-q-B-MCR2.107(C)(2)", "query": "I need the rule that sets up the definition for what constitutes handing over the papers to the other side in this general filing context, right before it lists the specific acceptable methods.", "query_previous": "I&#x27;m looking for the subrule that sets out what counts as actually getting the paperwork to the other side for purposes of this service and filing rule.", "citation": "MCR 2.107(C)(2)", "gold": ["MCR 2.107(C)(2)"], "also_answered_by": ["MCR 2.107(C)(2)(a)", "MCR 2.107(C)(2)(b)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.053, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "claude", "checker_note": "Both original faults survive: the gold is still the bare stub &#x27;Delivery of a copy to a party within this rule means&#x27; and the query is still self-referential (&#x27;this general filing context&#x27;, &#x27;right before it lists the specific acceptable methods&#x27;) rather than a question anyone would type.", "provision": "(2) Delivery to Party. Delivery of a copy to a party within this rule means"}, {"query_id": "mcr-q-A-MCR7.103(B)(1)(b)", "query": "District court judgment, and prior counsel let the deadline for the appeal we were entitled to take run out. Opposing counsel says the circuit court is now powerless to hear it at all. Is a missed deadline actually one of the listed grounds on which the circuit court can take a case, or is discretionary review only available where no appeal was ever available in the first place?", "query_previous": "District court judgment, and we blew the window for the appeal we were entitled to take. Any way into circuit court now?", "citation": "MCR 7.103(B)(1)(b)", "gold": ["MCR 7.103(B)(1)(b)"], "also_answered_by": ["MCR 7.105", "MCR 7.201(B)"], "query_type": "disambiguation", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.036, "regenerated": true, "review_stratum": "co-gold-claimed", "checker": "glm-5.2", "checker_note": "", "provision": "(b) an appeal of right could have been taken but was not timely filed;"}, {"query_id": "mcr-q-B-MCR3.970(E)(2)(b)", "query": "What are the substantive elements a plaintiff must prove to establish a claim for tortious interference with a business relationship in Michigan?", "query_previous": null, "citation": "MCR 3.970(E)(2)(b)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "", "provision": "(b) have information and authority adequate for responsible and effective participation in the proceeding for all purposes."}, {"query_id": "mcr-q-A-MCR3.987(C)(3)", "query": "Entering a judgment on a support arrearage that&#x27;s been building for years - what rate does interest run at on the unpaid amount?", "query_previous": null, "citation": "MCR 3.987(C)(3)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "A", "generator": "claude", "status": "draft", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "", "checker_note": "", "provision": "(3) Unless an attorney appears with the minor, the court must inform the minor of the right to the assistance of an attorney and that, if the court determines that it might sentence the respondent to jail or place the respondent in secure detention, the court will appoint an attorney at public expense if the respondent wants one and is financially unable to retain one. If the juvenile requests to proceed without the assistance of an attorney, the court must advise the minor of the dangers and disadvantages of self-representation and determine whether the minor is literate and competent to conduct the defense."}, {"query_id": "mcr-q-B-MCR7.210(B)(2)(b)", "query": "What are the elements a plaintiff must prove to establish a claim for tortious interference with a business relationship in Michigan?", "query_previous": null, "citation": "MCR 7.210(B)(2)(b)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "", "provision": "(b) Except as otherwise provided, the appellant must notice the motion to settle the record for hearing before the trial court or tribunal to be held within 21 days of the filing of the motion. If it is not the typical practice of a tribunal to conduct hearings, the motion to settle the record must be filed with the tribunal for consideration by the tribunal within 21 days of the filing of the motion. The motion must be filed and served at least 14 days before the date noticed for hearing or consideration to settle the record. If appellant filed a proposed statement of facts with the motion, appellee must file and serve on the appellant and other appellees an amendment or objection to the proposed statement of facts in the trial court or tribunal at least seven days before the time set for the settlement hearing or consideration. The trial court may adopt and file the appellant’s proposed statement of facts as the certified settled statement of facts."}, {"query_id": "mcr-q-B-MCR3.979(F)(5)", "query": "What are the elements a plaintiff must prove to establish a claim for tortious interference with a business relationship in Michigan?", "query_previous": null, "citation": "MCR 3.979(F)(5)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "", "provision": "(5) Action Following Motion or Petition to Revoke Juvenile Guardianship. After notice and a hearing on a petition to revoke the juvenile guardianship, if the court finds by a preponderance of evidence that continuation of the juvenile guardianship is not in the child’s best interests, and upon finding that it is contrary to the welfare of the child to be placed in or remain in the juvenile guardian’s home and that reasonable efforts were made to prevent removal, the court shall revoke the juvenile guardianship.   The court shall enter an order revoking the juvenile guardianship and placing the child under the care and supervision of the Department of Health and Human Services on a form approved by the state court administrator. Jurisdiction over the child under MCL 712A.2(b) is reinstated under the previous child protective proceeding upon entry of the order revoking the juvenile guardianship."}, {"query_id": "mcr-q-B-MCR5.201", "query": "Under what circumstances is a parent entitled to retroactive reimbursement for child support overpayments made during a pending divorce proceeding in Michigan?", "query_previous": null, "citation": "MCR 5.201", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "", "provision": "Except for MCR 5.204 and MCR 5.208, which apply in part to trustees and trusts, rules in this subchapter contain requirements applicable to all fiduciaries except trustees and apply to all estates except trusts."}, {"query_id": "mcr-q-A-MCR5.121(E)(1)", "query": "What can a conservator charge for administering a protected person&#x27;s estate in Michigan, and who decides whether the fee is reasonable?", "query_previous": null, "citation": "MCR 5.121(E)(1)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "A", "generator": "claude", "status": "draft", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "", "checker_note": "", "provision": "(1) During Appointment of Guardian Ad Litem. When the guardian ad litem appointed to represent the interest of a person is an attorney, that appointment does not create an attorney-client relationship. Communications between that person and the guardian ad litem are not subject to the attorney-client privilege. The guardian ad litem must inform the person whose interests are represented of this lack of privilege as soon as practicable after appointment. The guardian ad litem may report or testify about any communication with the person whose interests are represented."}, {"query_id": "mcr-q-B-MCR3.971(D)(2)", "query": "Under Michigan law, what are the elements a plaintiff must prove to establish a prima facie case of prima facie tort?", "query_previous": null, "citation": "MCR 3.971(D)(2)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "", "provision": "(2) Accurate Plea. The court shall not accept a plea of admission or of no contest without establishing support for a finding that one or more of the statutory grounds alleged in the petition are true, preferably by questioning the respondent unless the offer is to plead no contest. If the plea is no contest, the court shall not question the respondent, but, by some other means, shall obtain support for a finding that one or more of the statutory grounds alleged in the petition are true. The court shall state why a plea of no contest is appropriate."}, {"query_id": "mcr-q-B-MCR3.211(F)(2)(b)", "query": "What are the substantive legal elements a plaintiff must prove to establish a claim for intentional infliction of emotional distress in Michigan?", "query_previous": null, "citation": "MCR 3.211(F)(2)(b)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "", "provision": "(b) file a proof of service with the court certifying that the Domestic Relations Judgment Information form has been provided to the friend of the court office and, unless the court orders otherwise, to all other parties."}, {"query_id": "mcr-q-B-MCR3.222(A)(1)(d)", "query": "What are the elements a plaintiff must prove to establish a claim for tortious interference with a business relationship?", "query_previous": null, "citation": "MCR 3.222(A)(1)(d)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.111, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "Confirmed unanswerable; &#x27;tortious&#x27; appears nowhere in the corpus.", "provision": "(d) “Party A” is the equivalent of a plaintiff and means the party responsible for filing and service requirements."}, {"query_id": "mcr-q-A-MCR7.205(A)(2)(b)(iv)", "query": "What standard of review does the Court of Appeals use when a trial judge lets a plaintiff&#x27;s expert testify over objection, and where is that standard set out?", "query_previous": null, "citation": "MCR 7.205(A)(2)(b)(iv)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "A", "generator": "claude", "status": "draft", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "", "checker_note": "", "provision": "(iv) an order deciding a timely filed motion to withdraw plea under MCR 6.310(C), motion for directed verdict under MCR 6.419(C), motion to correct an invalid sentence under MCR 6.429(B), or motion for new trial under MCR 6.431(A); or"}, {"query_id": "mcr-q-B-MCR6.610(F)(6)(a)", "query": "What are the elements a plaintiff must prove to establish a claim for tortious interference with a business relationship in Michigan?", "query_previous": null, "citation": "MCR 6.610(F)(6)(a)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "", "provision": "(a) (if there is no plea agreement) whether anyone has promised the defendant anything, or (if there is a plea agreement) whether anyone has promised anything beyond what is in the plea agreement;"}, {"query_id": "mcr-q-B-MCR9.122(A)(1)", "query": "What are the elements a plaintiff must prove to establish a claim for breach of contract in Michigan?", "query_previous": null, "citation": "MCR 9.122(A)(1)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": null, "review_stratum": "unanswerable", "checker": "claude", "checker_note": "Confirmed unanswerable; &#x27;breach of contract&#x27; appears nowhere in the corpus.", "provision": "(1) A party aggrieved, including the complainant, by a final order entered by the board on review under MCR 9.118, may apply for leave to appeal to the Supreme Court under MCR 7.305 within 28 days after the order is entered. If a motion for reconsideration is filed before the board’s order takes effect, the application for leave to appeal to the Supreme Court may be filed within 28 days after the board enters its order granting or denying reconsideration."}, {"query_id": "mcr-q-C-MCR2.302(B)(4)(a)(i)", "query": "MCR 2.302(B)(4)(a)(i)?", "query_previous": null, "citation": "MCR 2.302(B)(4)(a)(i)", "gold": ["MCR 2.302(B)(4)(a)(i)"], "also_answered_by": [], "query_type": "citation_lookup", "arm": "C", "generator": "deterministic", "status": "accepted", "echo": null, "regenerated": null, "review_stratum": "accepted-random", "checker": "", "checker_note": "", "provision": "(a)(i) A party may through interrogatories require another party to identify each person whom the other party expects to call as an expert witness at trial, to state the subject matter about which the expert is expected to testify, and to state the substance of the facts and opinions to which the expert is expected to testify and a summary of the grounds for each opinion."}, {"query_id": "mcr-q-A-MCR3.965(B)(2)", "query": "At the first hearing on a protective petition, is the judge required to ask about tribal affiliation, and of whom? What if the answer suggests the child is covered?", "query_previous": null, "citation": "MCR 3.965(B)(2)", "gold": ["MCR 3.965(B)(2)"], "also_answered_by": [], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.357, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(2) The court must inquire if the child or either parent is a member of an Indian tribe. If the court knows or has reason to know the child is an Indian child, the court must determine the identity of the child’s tribe and, if the child was taken into protective custody pursuant to MCR 3.963(A) or the petition requests removal of the child, follow the procedures set forth in MCR 3.967. If necessary, the court may adjourn the preliminary hearing pending the conclusion of the removal hearing. A removal hearing may be held in conjunction with the preliminary hearing if all necessary parties have been notified as required by MCR 3.905, there are no objections by the parties to do so, and at least one qualified expert witness is present to provide testimony."}, {"query_id": "mcr-q-B-MCR4.201(H)(2)(a)", "query": "In an eviction case, if the defendant raises a defense based on equitable principles, does the court lose jurisdiction and have to transfer the matter out of summary proceedings?", "query_previous": null, "citation": "MCR 4.201(H)(2)(a)", "gold": ["MCR 4.201(H)(2)(a)"], "also_answered_by": [], "query_type": "cross_reference", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.312, "regenerated": null, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(a) A summary proceedings action need not be removed from the court in which it is filed because an equitable defense or counterclaim is interposed."}, {"query_id": "mcr-q-A-MCR3.301(C)", "query": "Filed for superintending control and the judge signed an order to show cause before anything went out the door. Do I still need to get a summons served separately?", "query_previous": null, "citation": "MCR 3.301(C)", "gold": ["MCR 3.301(C)"], "also_answered_by": [], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.294, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(C) Process; Service of Writs. Process must be issued and served as in other civil actions. However, if a writ, order, or order to show cause is issued before service of process, then service of the writ, order, or order to show cause in the manner prescribed in MCR 2.105, accompanied by a copy of the complaint, makes service of other process unnecessary."}, {"query_id": "mcr-q-B-MCR5.311(B)(3)", "query": "What needs to be filed with the court for an estate fiduciary to get released from responsibility, and when can the judge grant that release?", "query_previous": null, "citation": "MCR 5.311(B)(3)", "gold": ["MCR 5.311(B)(3)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.2, "regenerated": null, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(3) Discharge. A personal representative may petition for discharge from liability with notice to the interested persons. A personal representative who files such a petition with the court must also file the documents described in MCR 5.310(C) and (D), as applicable, proofs of service of those documents that are required to be served on interested persons, and such other documents as the court may require. The court may order the personal representative discharged if the court is satisfied that the personal representative has properly administered the estate."}, {"query_id": "mcr-q-A-MCR3.103(E)(1)", "query": "Sheriff seized my client&#x27;s equipment under a writ of attachment. Who puts a value on the seized items, and how many people have to sign off on that valuation?", "query_previous": null, "citation": "MCR 3.103(E)(1)", "gold": ["MCR 3.103(E)(1)"], "also_answered_by": [], "query_type": "disambiguation", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.4, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(1) The sheriff or other officer to whom a writ of attachment is directed shall execute the writ by seizing and holding so much of the defendant&#x27;s property not exempt from execution, wherever found within the county, as is necessary to satisfy the plaintiff&#x27;s demand and costs. If insufficient property is seized, then the officer shall seize other property of the defendant not exempt from execution, wherever found within Michigan, as is necessary when added to that already seized, to satisfy the plaintiff&#x27;s demand and costs. The property seized must be inventoried by the officer and appraised by two disinterested residents of the county in which the property was seized. After being sworn under oath to make a true appraisal, the appraisers shall make and sign an appraisal. The inventory and appraisal must be filed and a copy served on the parties under MCR 2.107."}, {"query_id": "mcr-q-A-MCR1.111(H)(2)(a)", "query": "Judge denied my client an interpreter. Five-judge district. Who takes the second look at that, and do they start fresh or defer to the first ruling?", "query_previous": null, "citation": "MCR 1.111(H)(2)(a)", "gold": ["MCR 1.111(H)(2)(a)"], "also_answered_by": [], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.067, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(a) In a court having two or more judges, the chief judge shall decide the request for review de novo."}, {"query_id": "mcr-q-B-MCR8.127(C)(1)", "query": "My client interprets in Michigan courts and just realized she forgot to submit her yearly paperwork. It&#x27;s already October 15th. Does she just pay the extra hundred dollars, or is there another hurdle because we&#x27;re past September?", "query_previous": null, "citation": "MCR 8.127(C)(1)", "gold": ["MCR 8.127(C)(1)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.091, "regenerated": null, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(1) Interpreters who meet the requirements of MCR 1.111(A)(4) and MCR 1.111(A)(6)(a) and (b) must register with the State Court Administrative Office and renew their registration before October 1 of each year in order to maintain their status. The fee for registration is $60. The fee for renewal is $30. The renewal application shall include a statement showing that the applicant has used interpreting skills during the 12 months preceding registration. Effective 2019, renewal applications must be filed or postmarked on or before September 1. Any application filed or postmarked after that date must be accompanied by a late fee of $100. Any late registration made after December 31 or any application that does not demonstrate efforts to maintain proficiency shall require board approval."}, {"query_id": "mcr-q-A-MCR3.979(F)(1)(a)", "query": "Juvenile guardianship in an abuse and neglect file has gone sideways and the guardian won&#x27;t step aside. Who can push to undo it, and does the judge need somebody to file something first?", "query_previous": null, "citation": "MCR 3.979(F)(1)(a)", "gold": ["MCR 3.979(F)(1)(a)"], "also_answered_by": [], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.167, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(a) Revocation of Juvenile Guardianship. The court shall, on its own motion or upon petition from the Department of Health and Human Services or the child’s lawyer-guardian ad litem, hold a hearing to determine whether a juvenile guardianship established under this section shall be revoked."}, {"query_id": "mcr-q-C-MCR4.201(B)(3)(c)", "query": "MCR 4.201(B)(3)(c) -- what does it provide?", "query_previous": null, "citation": "MCR 4.201(B)(3)(c)", "gold": ["MCR 4.201(B)(3)(c)"], "also_answered_by": [], "query_type": "citation_lookup", "arm": "C", "generator": "deterministic", "status": "accepted", "echo": null, "regenerated": null, "review_stratum": "accepted-random", "checker": "", "checker_note": "", "provision": "(c) If the tenancy is of residential premises, the complaint must allege that the lessor or licensor has performed his or her covenants to keep the premises fit for the use intended, in reasonable repair during the term of the lease or license, and in compliance with applicable state and local health and safety laws, except when the disrepair or violation has been caused by the tenant’s willful or irresponsible conduct or lack of conduct, or the parties to the lease or license have modified those obligations, as provided for by statute. Plaintiff must explain any defects in this allegation, for example local government’s failure to inspect despite a request to do so. The relevant SCAO form must provide space for this explanation. A court may not refuse a filing based on anything in this subrule."}, {"query_id": "mcr-q-B-MCR7.313(D)", "query": "For a case set for Supreme Court oral argument, we missed the deadline to arrange the calendar by agreement and now need to move our argument date. What must we include in the filing to get the delay, and what consequence does the rule warn us about if we waited too long to ask?", "query_previous": "If the Supreme Court session docket is already out and we realize we need a postponement, can we just file a joint agreement to bump the hearing, or do we need to make a formal request?", "citation": "MCR 7.313(D)", "gold": ["MCR 7.313(D)"], "also_answered_by": [], "query_type": "disambiguation", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.136, "regenerated": true, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(D) Rearrangement of Calendar; Adjournment. At least 21 days before the first day of a session, the parties may stipulate to have a case specially placed on the calendar, grouped to suit the convenience of the attorneys, or placed at the beginning or end of the call. After that time, changes to the session calendar may be requested only by motion, not by stipulation of the parties. A motion to adjourn a case from the call after the schedule is released will be granted only by order upon a showing of good cause with an explanation of why the motion could not have been filed sooner. Costs payable to the Court may be imposed on the moving party for a late-filed motion to adjourn."}, {"query_id": "mcr-q-A-MCR6.911(B)", "query": "Prelim on a juvenile charged under the automatic waiver statute — the magistrate finds no probable cause on the qualifying charge but does find it on a lesser offense. Where does the case go, and do we have to pay for the exam transcript?", "query_previous": null, "citation": "MCR 6.911(B)", "gold": ["MCR 6.911(B)"], "also_answered_by": [], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.476, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(B) Transfer to Family Division of Circuit Court. If the magistrate, following preliminary examination, finds that there is no probable cause to believe that a specified juvenile violation occurred or that there is no probable cause to believe that the juvenile committed the specified juvenile violation, but that some other offense occurred that if committed by an adult would constitute a crime, and that there is probable cause to believe that the juvenile committed that offense, the magistrate shall transfer the matter to the family division of the circuit court in the county where the offense is alleged to have been committed for further proceedings. If the court transfers the matter to the family division, a transcript of the preliminary examination shall be sent to the family division without charge upon request."}, {"query_id": "mcr-q-B-MCR8.107(B)", "query": "A trial judge asks whether she still has to file the quarterly report with the chief judge even if she has a completely clear docket and zero delayed cases this period.", "query_previous": null, "citation": "MCR 8.107(B)", "gold": ["MCR 8.107(B)"], "also_answered_by": [], "query_type": "disambiguation", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.412, "regenerated": null, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(B) Report as to Matters Undecided. On the first business day of January, April, July, and October of each year, every trial judge shall file a certified statement with the chief judge in the form prescribed by the state court administrator. The statement shall provide information on all matters pending during the reporting period that were not decided within 56 days from submission. The judge shall state the reason that a decision was not made within 56 days. A report is required regardless of whether there is any case to report. The chief judge shall sign and file, or electronically submit, the statement with the state court administrator."}, {"query_id": "mcr-q-A-MCR7.108(B)(3)(a)", "query": "Drafting a stay bond in a civil appeal - what does it have to recite on its face about the case, the parties, and what was awarded below?", "query_previous": null, "citation": "MCR 7.108(B)(3)(a)", "gold": ["MCR 7.108(B)(3)(a)"], "also_answered_by": [], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.154, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(a) recite the names and designations of the parties and the judge in the trial court; identify the parties for whom and against whom judgment was entered; and state the amount of the judgment, including any costs, interest, attorney fees, and sanctions assessed;"}, {"query_id": "mcr-q-C-MCR3.951(B)(2)(b)(ii)", "query": "Show me MCR 3.951(B)(2)(b)(ii)", "query_previous": null, "citation": "MCR 3.951(B)(2)(b)(ii)", "gold": ["MCR 3.951(B)(2)(b)(ii)"], "also_answered_by": [], "query_type": "citation_lookup", "arm": "C", "generator": "deterministic", "status": "accepted", "echo": null, "regenerated": null, "review_stratum": "accepted-random", "checker": "", "checker_note": "", "provision": "(ii) of the right to trial by judge or jury on the allegations in the petition;"}, {"query_id": "mcr-q-C-MCR6.007", "query": "I need the language of MCR 6.007", "query_previous": null, "citation": "MCR 6.007", "gold": ["MCR 6.007"], "also_answered_by": [], "query_type": "citation_lookup", "arm": "C", "generator": "deterministic", "status": "accepted", "echo": null, "regenerated": null, "review_stratum": "accepted-random", "checker": "", "checker_note": "", "provision": "Records are public except as otherwise indicated in court rule or statute."}, {"query_id": "mcr-q-B-MCR8.119(E)", "query": "Our office just submitted a settlement evaluation to the court, and we also need to leave the original exhibits with the clerk for the upcoming trial. Who at the court is actually tasked with physically keeping track of those kinds of case-processing items?", "query_previous": "Our office is updating the internal file-retention protocol for items that aren&#x27;t standard filings but are handled by the court during the course of a matter—like safekeeping deposits for wills, sentencing investigations, and FOC paperwork. Whose directive establishes the person responsible for keeping those records, and what governs the format?", "citation": "MCR 8.119(E)", "gold": ["MCR 8.119(E)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.167, "regenerated": true, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(E) Other Case Records. The clerk or other persons designated by the chief judge of the court shall maintain in the manner prescribed by these rules, other materials filed with or handled by the court for purposes of case processing, including but not limited to wills filed for safekeeping, case evaluations, exhibit logs, presentence reports, probation files, problem-solving court treatment files, financial statements for collections, and friend of the court records."}, {"query_id": "mcr-q-A-MCR3.952(B)(2)", "query": "Designation hearing is being set while everyone is standing in the courtroom. Can the judge just announce the date on the record, or does something have to go out in the mail?", "query_previous": null, "citation": "MCR 3.952(B)(2)", "gold": ["MCR 3.952(B)(2)"], "also_answered_by": [], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.333, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(2) Notice of the date, time, and place of the designation hearing must be given to the juvenile, the juvenile&#x27;s parent, guardian, or legal custodian, the attorney for the juvenile, if any, and the prosecuting attorney. The notice may be given either orally on the record or in writing, served on each individual by mail, or given in another manner reasonably calculated to provide notice."}, {"query_id": "mcr-q-B-MCR6.931(E)(4)(d)", "query": "Before imposing a blended sentence on a juvenile under the designated proceedings, the court must weigh several statutory factors regarding the youth&#x27;s background. One factor explicitly calls attention to the child&#x27;s track record in prior programs — what is that factor?", "query_previous": "At a juvenile disposition hearing, the court is reviewing the child&#x27;s background. What specific aspect of the minor&#x27;s prior engagement with treatment or rehabilitative services must be included in the report?", "citation": "MCR 6.931(E)(4)(d)", "gold": ["MCR 6.931(E)(4)(d)"], "also_answered_by": ["MCR 3.950(D)(2)(d)(iv)", "MCR 3.952(C)(3)(d)", "MCR 3.955(A)(4)"], "query_type": "disambiguation", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.0, "regenerated": true, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(d) the juvenile&#x27;s programming history, including, but not limited to, the juvenile&#x27;s past willingness to participate meaningfully in available programming;"}, {"query_id": "mcr-q-A-MCR9.121(C)(4)", "query": "Lawyer placed on probation because of an impairment — what&#x27;s the ceiling on how long that can run, can it be stretched further, and how many shots does he get at ending it early?", "query_previous": null, "citation": "MCR 9.121(C)(4)", "gold": ["MCR 9.121(C)(4)"], "also_answered_by": [], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.214, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(4) A respondent may be placed on probation for up to 3 years. The probation order expires on the date specified in it unless the administrator petitions for, and the hearing panel, board, or court grants, an extension. An extension may not exceed 3 years. A probation order may be dissolved if the respondent demonstrates that the impairment giving rise to the probation order has been removed and that the probation order has been fully complied with, but only one motion to accelerate dissolution of a probation order may be filed during the probation period."}, {"query_id": "mcr-q-B-MCR3.911(C)(3)(b)", "query": "In this juvenile proceeding, the court granted the multiple respondents extra peremptory strikes because of their separate interests. I represent the petitioner side. What is the ceiling on the total strikes the court can give my side in response?", "query_previous": "Three defendants are being tried jointly and each side got extra strikes because of the multiple parties. How do I figure out the maximum number of strikes the plaintiffs get as a group?", "citation": "MCR 3.911(C)(3)(b)", "gold": ["MCR 3.911(C)(3)(b)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.263, "regenerated": true, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(b) When multiple parties are allowed more than 5 peremptory challenges under this subrule, the court may allow the opposite side a total number of peremptory challenges not to exceed the number allowed to the multiple parties."}, {"query_id": "mcr-q-A-MCR3.205(D)(2)(b)", "query": "The court with the earlier proceeding over this child asked to be kept current on our case. Beyond notifying them of hearings, what do we have to send them and to whose attention?", "query_previous": null, "citation": "MCR 3.205(D)(2)(b)", "gold": ["MCR 3.205(D)(2)(b)"], "also_answered_by": [], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "accepted", "echo": 0.188, "regenerated": null, "review_stratum": "accepted-random", "checker": "glm-5.2", "checker_note": "", "provision": "(b) must send copies of all orders entered in the subsequent court to the attention of the clerk or register and the appropriate official of the prior court."}, {"query_id": "mcr-q-B-MCR1.101", "query": "Where in the court rules does it say what the entire set of rules is officially called, and how to abbreviate an individual rule when citing it?", "query_previous": null, "citation": "MCR 1.101", "gold": ["MCR 1.101"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.4, "regenerated": null, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "These rules are the “Michigan Court Rules of 1985.” An individual rule may be referred to as “Michigan Court Rule __________,” and cited by the symbol “MCR __________.” For example, this rule may be cited as MCR 1.101."}, {"query_id": "mcr-q-B-MCR2.510(D)", "query": "The chief judge wants to call in a panel of prospective jurors for voir dire next week. For the ones who have never had to show up for jury duty before, can we just have the jury coordinator phone them, or does the initial contact need to be a mailed letter to their house?", "query_previous": null, "citation": "MCR 2.510(D)", "gold": ["MCR 2.510(D)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "accepted", "echo": 0.148, "regenerated": null, "review_stratum": "accepted-random", "checker": "claude", "checker_note": "", "provision": "(D) Summoning Jurors for Court Attendance. The court clerk, the court administrator, the sheriff, or the jury board, as designated by the chief judge, shall summon jurors for court attendance at the time and in the manner directed by the chief judge. For a juror&#x27;s first required court appearance, service must be by written notice addressed to the juror at the juror&#x27;s residence as shown by the records of the clerk or jury board. The notice may be by ordinary mail or by personal service. For later service, notice may be in the manner directed by the court. The person giving notice to jurors shall keep a record of the notice and make a return if directed by the court. The return is presumptive evidence of the fact of service."}];
const HASH  = "8035f9f015f110a22793cdd1bbb0fe969d8f286e357821333bb29a76521e2999";
const KEY   = "mcr-eval-review-" + HASH.slice(0,12);
let dec = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = 0;
const $ = s => document.querySelector(s);
const save = () => localStorage.setItem(KEY, JSON.stringify(dec));

function firstUndecided(){
  for (let k=0;k<ITEMS.length;k++) if(!dec[ITEMS[k].query_id]) return k;
  return ITEMS.length;
}
function render(){
  const done = Object.keys(dec).length;
  $("#bar>div").style.width = (100*done/ITEMS.length)+"%";
  const t={good:0,badgold:0,ambiguous:0,drop:0};
  Object.values(dec).forEach(d=>t[d.action]!==undefined&&t[d.action]++);
  $("#tally").textContent = `${t.good} sound / ${t.badgold} wrong gold / ${t.ambiguous} ambiguous / ${t.drop} dropped`;
  if(i>=ITEMS.length){
    $("#pos").textContent="";
    $("#app").innerHTML=`<div class="done"><h2>All ${ITEMS.length} reviewed.</h2>
      <p class="meta">Download the decisions file.</p></div>`;
    return;
  }
  const it=ITEMS[i], d=dec[it.query_id];
  $("#pos").textContent=`${i+1} / ${ITEMS.length}`;
  $("#app").innerHTML=`
    <div class="meta">
      <span class="tag hot">${it.review_stratum}</span>
      <span class="tag">${it.arm} · ${it.generator}</span>
      <span class="tag">${it.query_type}</span>
      <span class="tag">${it.status}</span>
      ${it.regenerated?'<span class="tag">rewritten</span>':''}
      ${it.echo!==undefined?`<span class="tag">echo ${it.echo}</span>`:''}
      ${d?`<span class="tag hot">recorded: ${d.action}</span>`:''}
    </div>
    <div class="q">${it.query}</div>
    <div class="meta"><b>Labelled to ${it.citation}</b>${
      it.also_answered_by&&it.also_answered_by.length
        ? ` &nbsp;·&nbsp; also credited: ${it.also_answered_by.join(", ")}` : ""}</div>
    <div class="prov">${it.provision||"(no text)"}</div>
    ${it.checker_note?`<div class="note"><b>${it.checker}:</b> ${it.checker_note}</div>`:""}
    ${it.query_previous?`<div class="prev"><b>before rewrite:</b> ${it.query_previous}</div>`:""}
    <div class="meta">Is this question answered by the provision above, and by
      that provision rather than some other rule?</div>`;
}
function record(action){
  dec[ITEMS[i].query_id]={action, at:new Date().toISOString()};
  save(); i++; render();
}
document.querySelectorAll("footer button").forEach(b=>b.onclick=()=>{
  const a=b.dataset.a;
  if(a==="skip"){i++;render();}
  else if(a==="back"){i=Math.max(0,i-1);render();}
  else record(a);
});
document.onkeydown=e=>{
  if(e.metaKey||e.ctrlKey)return;
  const k=e.key.toLowerCase();
  if(k==="a")record("good"); else if(k==="g")record("badgold");
  else if(k==="c")record("ambiguous"); else if(k==="r")record("drop");
  else if(k===" "){e.preventDefault();i++;render();}
  else if(k==="arrowleft"){i=Math.max(0,i-1);render();}
};
$("#dl").onclick=()=>{
  const blob=new Blob([JSON.stringify({set_hash:HASH,n:ITEMS.length,decisions:dec},null,1)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="review_decisions.json"; a.click();
