<!doctype html>
<meta charset="utf-8"><title>MCR evaluation set — review</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#666;--line:#d8d8d8;
--ok:#0a7;--no:#c33;--fix:#c80;--card:#fafafa}
@media(prefers-color-scheme:dark){:root{--bg:#151515;--fg:#eee;--mut:#999;
--line:#333;--card:#1e1e1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
#bar{flex:1;height:6px;background:var(--line);border-radius:3px;min-width:110px}
#bar>div{height:100%;background:var(--ok);border-radius:3px;width:0}
main{max-width:860px;margin:0 auto;padding:18px 16px 120px}
.q{font-size:19px;margin:12px 0 16px;font-weight:500}
.prov{border:1px solid var(--line);border-radius:8px;padding:12px 14px;
background:var(--card);white-space:pre-wrap;font-size:14px;max-height:340px;
overflow:auto}
.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;
padding:1px 9px;font-size:12px;color:var(--mut);margin:0 6px 4px 0}
.tag.hot{border-color:var(--fix);color:var(--fix)}
.meta{color:var(--mut);font-size:13px;margin-bottom:8px}
.note{border-left:3px solid var(--fix);padding:8px 12px;margin:14px 0;
color:var(--mut);font-size:14px}
.prev{border-left:3px solid var(--line);padding:6px 12px;margin:10px 0;
color:var(--mut);font-size:13px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;
justify-content:center;flex-wrap:wrap}
button{font:inherit;padding:8px 15px;border-radius:8px;border:1px solid var(--line);
background:var(--card);color:var(--fg);cursor:pointer}
button.ok{border-color:var(--ok);color:var(--ok)}
button.no{border-color:var(--no);color:var(--no)}
button.fix{border-color:var(--fix);color:var(--fix)}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);
border-radius:4px;padding:0 4px;color:var(--mut)}
.done{text-align:center;padding:48px 0}
</style>
<header>
  <strong>MCR eval review</strong>
  <span id="pos" class="meta"></span>
  <div id="bar"><div></div></div>
  <span id="tally" class="meta"></span>
  <button id="dl">Download decisions</button>
</header>
<main id="app"></main>
<footer>
  <button class="ok" data-a="good">Question is sound <kbd>a</kbd></button>
  <button class="fix" data-a="badgold">Wrong gold <kbd>g</kbd></button>
  <button class="fix" data-a="ambiguous">Another rule answers too <kbd>c</kbd></button>
  <button class="no" data-a="drop">Drop it <kbd>r</kbd></button>
  <button data-a="skip">Skip <kbd>space</kbd></button>
  <button data-a="back">Back <kbd>&larr;</kbd></button>
</footer>
<script>
const ITEMS = [{"query_id": "mcr-q-B-MCR5.411", "query": "My client is opening a conservatorship with unencumbered funds and the judge is deciding whether to require a surety. I recall there is a rule about the court setting the amount and a carve-out for Michigan trust companies and banks with trust powers. Which rule is it?", "query_previous": "I&#x27;m handling a conservatorship with unencumbered assets and the judge is deciding whether to require a surety. Which court rule covers the judge&#x27;s discretion to set that amount, and the carve-out for Michigan trust companies and banks with trust powers?", "citation": "MCR 5.411", "gold": ["MCR 5.411"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.364, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Fault not repaired: the rewrite still lifts the corpus-unique phrase &#x27;Michigan trust companies and banks with trust powers&#x27; verbatim, which was the sole reason for regeneration.", "provision": "In all conservatorships in which there are unrestricted assets, the court may require a bond in the amount the court finds necessary to protect the estate or as required by statute. No bond shall be required of trust companies organized under the laws of Michigan or of banks with trust powers unless the court orders that a bond be required."}, {"query_id": "mcr-q-B-MCR7.120(F)(3)", "query": "On judicial review of an implied-consent refusal suspension, does the circuit court have the authority to order the Secretary of State to issue a license allowing the petitioner to operate a commercial vehicle hauling hazardous materials?", "query_previous": "When a driver appeals an administrative action taken under the statutory provisions listed for license denials, suspensions, or restrictions — including a first offense under the drug-impaired driving statute — what is the scope of the circuit court&#x27;s authority on review, and is there any category of credential the court is prohibited from directing the Secretary of State to restore?", "citation": "MCR 7.120(F)(3)", "gold": ["MCR 7.120(F)(3)"], "also_answered_by": [], "query_type": "cross_reference", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.522, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Repaired the statute mischaracterization but now asks in the rule&#x27;s own words - &#x27;commercial vehicle hauling hazardous materials&#x27; is the only hazmat text in the corpus, so lexical match alone retrieves the gold.", "provision": "(3) Decision. For denials, suspensions, or restrictions of the person’s license under MCL 257.303(1)(d), MCL 257.320, MCL 257.904(10), MCL 257.904(11), MCL 257.310d, or for a first violation of MCL 257.625f, the circuit court may affirm, modify, or set aside the restriction, suspension, or denial. The circuit court, however, shall not order the Secretary of State to issue a restricted or unrestricted chauffeur’s license that would permit the person to drive a commercial motor vehicle that hauls hazardous materials."}, {"query_id": "mcr-q-B-MCR9.311", "query": "I&#x27;m drafting a motion regarding the safeguarding of former client files now that outside supervision of the firm has been triggered by the principal&#x27;s incapacity. Which rule allows the court to issue orders about the delivery, storage, or destruction of those materials and lets the appointed manager discard them under a retention policy?", "query_previous": "Which rule gives the trial court authority to issue directives about what happens to the belongings and case materials of a lawyer whose practice got shut down by the disciplinary system?", "citation": "MCR 9.311", "gold": ["MCR 9.311"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.29, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Mischaracterization is fixed (client files, incapacity-based Affected Attorney per MCR 9.301(A)), but the query now quotes the rule&#x27;s distinctive strings &#x27;delivery, storage, or destruction&#x27; and the file &#x27;retention policy&#x27; destruction clause, making it string-matchable.", "provision": "The circuit court has jurisdiction over all of the files, records, and property of clients of the Affected Attorney and may make any appropriate orders to protect the interests of the clients of the Affected Attorney and, to the extent possible and not inconsistent with the protection of clients, the interests of the Affected Attorney, including, but not limited to, orders relating to the delivery, storage, or destruction of the client files of the Affected Attorney. The Interim Administrator may maintain client documents in paper or electronic format. The Interim\n\nAdministrator may destroy any client document pursuant to the law office file retention policy or as necessary to meet ethical obligations, whichever is shorter, without returning to the court for permission to do so."}, {"query_id": "mcr-q-B-MCR8.108(G)(2)(a)(viii)", "query": "I&#x27;m looking at the statute listing who sits on the Court Reporting and Recording Board of Review. I know one of the seats is set aside for a transcriptionist from outside the judicial branch, but I specifically need the subsection for the one who does not work for a trial court in this state. Which subparagraph is that?", "query_previous": "I&#x27;m trying to find the list of categories of people who count as &quot;court reporters&quot; for purposes of contracting with SADO. Specifically, I remember it includes a transcriptionist who works independently and isn&#x27;t on the payroll of a trial court in this state. Which subparagraph was that?", "citation": "MCR 8.108(G)(2)(a)(viii)", "gold": ["MCR 8.108(G)(2)(a)(viii)"], "also_answered_by": ["MCR 8.108(G)(2)(a)(vii)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.043, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "The original fault is unrepaired: &#x27;a transcriptionist ... who does not work for a trial court in this state&#x27; describes (vii) (court reporter not employed by a Michigan court) exactly as well as (viii) (court recorder), and &#x27;trial court&#x27; is also wrong since the rule says &#x27;Michigan court&#x27;.", "provision": "(viii) a court recorder who is not an employee of a Michigan court; and,"}, {"query_id": "mcr-q-B-MCR3.921(B)(2)(l)", "query": "In a child protective proceeding, at the dispositional review or permanency planning stage, if the court knows or has reason to know the youth is an Indian child but we cannot identify the parents, guardian, legal custodian, or tribe, what entity receives notice on behalf of the federal government?", "query_previous": "In a juvenile case where we suspect the youth is Native American but can&#x27;t track down the family or the tribal affiliation, who gets served on behalf of the federal government?", "citation": "MCR 3.921(B)(2)(l)", "gold": ["MCR 3.921(B)(2)(l)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.407, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Scoping to dispositional review/permanency planning fixes the ambiguity, but the query now quotes the leaf verbatim (&#x27;knows or has reason to know ... Indian child&#x27; plus &#x27;parents, guardian, legal custodian, or tribe&#x27;); paraphrase those two strings.", "provision": "(l) if the court knows or has reason to know the child is an Indian child and the parents, guardian, legal custodian, or tribe are unknown, to the Secretary of Interior, and"}, {"query_id": "mcr-q-B-MCR2.401(J)(2)(e)", "query": "Does a party&#x27;s failure to amend an initial discovery disclosure automatically result in preclusion of the witness, or must the opposing party file a motion to enforce the scheduling order deadline?", "query_previous": "What is the maximum amount of damages a plaintiff can recover in a small claims case?", "citation": "MCR 2.401(J)(2)(e)", "gold": [], "also_answered_by": ["MCR 2.302(E)(2)", "MCR 2.313(C)(1)"], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.0, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Item is typed &#x27;unanswerable&#x27; but MCR 2.313(C)(1) answers it squarely (a party who fails to disclose or supplement &#x27;is not allowed to use that information or witness&#x27; absent justification, i.e. automatic preclusion with no motion required), so the dedupe fix produced a question the corpus does answer.", "provision": "(e) the sources of any ESI that are not reasonably accessible because of undue burden or cost."}, {"query_id": "mcr-q-A-MCR2.306(C)(5)(c)", "query": "Deposition, my question is sitting on the table unanswered, and the witness is quietly thumbing his phone at his own lawyer. Opposing counsel says the restriction on a witness conferring mid-question only reaches out-loud conversation. Is he right?", "query_previous": "Question is pending at a deposition and I can see the witness thumbing messages to his lawyer under the table. Does the bar on talking to a deponent reach that, or only out-loud conversation?", "citation": "MCR 2.306(C)(5)(c)", "gold": ["MCR 2.306(C)(5)(c)"], "also_answered_by": ["MCR 2.306(C)(5)", "MCR 2.306(C)(5)(b)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "needs_revision", "echo": 0.0, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "glm-5.2", "checker_note": "The question is answerable and realistic, but MCR 2.306(C)(5) is a better target because it establishes the underlying ban on communicating during a deposition, while (C)(5)(c) merely defines the word &#x27;communicate&#x27; for that subsection.", "provision": "(c) For purposes of this rule, “communicate” includes electronic communication conducted by text message, email or other transmission using an electronic device."}, {"query_id": "mcr-q-B-MCR2.105(D)(3)", "query": "I need to serve process on a dissolved business entity whose term of existence expired. To avoid a challenge that I picked the wrong former official, which specific leadership role does the statute designate as an authorized recipient for the lawsuit papers?", "query_previous": "My client wants to sue a company that let its corporate charter lapse years ago and hasn&#x27;t kept up any officers since. Who can I serve with the summons to get jurisdiction over it?", "citation": "MCR 2.105(D)(3)", "gold": ["MCR 2.105(D)(3)"], "also_answered_by": ["MCR 2.105(D)(4)"], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.2, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Query asks for &#x27;which specific leadership role&#x27; (singular) but MCR 2.105(D)(3) names five alternatives (last presiding officer, president, cashier, secretary, or treasurer); it also calls a court rule &#x27;the statute&#x27; and lifts &#x27;term of existence expired&#x27; verbatim, which is the exact string shared with MCR 2.105(D)(4)(c).", "provision": "(3) serving a summons and a copy of the complaint on the last presiding officer, president, cashier, secretary, or treasurer of a corporation that has ceased to do business by failing to keep up its organization by the appointment of officers or otherwise, or whose term of existence has expired;"}, {"query_id": "mcr-q-B-MCR9.305(A)(1)(c)", "query": "I&#x27;m drafting the ex parte petition to appoint an interim administrator for an incapacitated attorney&#x27;s practice. To meet the pleading requirements, I need to cite the specific subsection stating that my proposed appointee is eligible for this role. Which subsection is that?", "query_previous": "When a court is weighing whether to put a lawyer in charge of a legal practice on a temporary basis, which subsection confirms that the candidate satisfies the eligibility criteria for that specific role?", "citation": "MCR 9.305(A)(1)(c)", "gold": ["MCR 9.305(A)(1)(c)"], "also_answered_by": [], "query_type": "disambiguation", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.143, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Misframing repaired, but the query still restates (c)&#x27;s entire content (&#x27;my proposed appointee is eligible for this role&#x27; = &#x27;the attorney proposed to be appointed as Interim Administrator is qualified&#x27;), so it is a name-the-subsection string match.", "provision": "(c) the attorney proposed to be appointed as Interim Administrator is qualified under this rule."}, {"query_id": "mcr-q-B-MCR3.803(A)(2)", "query": "If our adoption agency already submitted the itemized accounting of fees and expenses for this placement, do I need to file a new one at the next statutory update if our costs haven&#x27;t changed?", "query_previous": "Does a receiver&#x27;s previously submitted sworn financial disclosure need to be refiled at each periodic update required by statute?", "citation": "MCR 3.803(A)(2)", "gold": ["MCR 3.803(A)(2)"], "also_answered_by": ["MCR 3.803(A)(1)"], "query_type": "cross_reference", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.118, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Query&#x27;s subject is the &#x27;itemized accounting of fees and expenses,&#x27; which is MCR 3.803(A)(1)&#x27;s topic (update may incorporate itemized expenses by reference); gold (A)(2) governs the verified statement, so name (A)(1) as co-gold or say &#x27;verified statement.&#x27;", "provision": "(2) Any verified statement filed pursuant to MCL 710.54(7) need not be filed again unless, at the time of the update required by MCL 710.54(8), any such statement does not reflect the facts at that time."}, {"query_id": "mcr-q-B-MCR3.961(B)(2)(b)", "query": "I&#x27;m drafting the initial pleading for a juvenile matter and need to make sure I include the identifying information for the non-parent caretaker. Which rule sets out the required petition content regarding the individual who has physical custody of the child when it&#x27;s not the biological mom or dad?", "query_previous": "In a child protective petition, which provision specifically lists the non-parent who is physically taking care of the minor as a necessary party?", "citation": "MCR 3.961(B)(2)(b)", "gold": ["MCR 3.961(B)(2)(b)"], "also_answered_by": ["MCR 3.931(B)(2)(b)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.12, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "The rewrite dropped &#x27;child protective&#x27; for the generic &#x27;juvenile matter,&#x27; so MCR 3.931(B)(2)(b) -- near word-for-word identical petition-content leaf for delinquency petitions -- is now an unmarked co-valid answer; restore the protective-proceeding cue or add it as co-gold.", "provision": "(b) the parent, guardian, legal custodian, or person who has custody of the child, if other than a mother or father, and"}, {"query_id": "mcr-q-B-MCR7.105(B)(1)(a)", "query": "I&#x27;m prepping the application for leave in a criminal case and need to identify the docket entry for the lower court&#x27;s disposition so I can include its timing and the type of ruling in the application&#x27;s contents section. Which court rule sets out that contents requirement for this specific application?", "query_previous": "When I&#x27;m filling out the application for leave to appeal, the first thing it wants me to describe is the underlying ruling—specifically when it was issued and what kind of disposition it was. Where in the court rules is that requirement set out?", "citation": "MCR 7.105(B)(1)(a)", "gold": ["MCR 7.105(B)(1)(a)"], "also_answered_by": ["MCR 7.205(B)(1)"], "query_type": "cross_reference", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.0, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Fault unrepaired: MCR 7.105 governs applications for leave to appeal to the CIRCUIT court and is not criminal-specific, so adding &#x27;in a criminal case&#x27; does nothing to exclude MCR 7.205(B)(1), which imposes the identical &#x27;date and nature of the judgment or order appealed from&#x27; requirement in the Court of Appeals.", "provision": "(a) stating the date and nature of the judgment, order, or decision appealed;"}, {"query_id": "mcr-q-A-MCR5.404(B)(2)(d)", "query": "Voluntary guardianship petition for a tribal child, both parents consented, nobody is fighting about anything. Is the judge still supposed to take up on the record whether this child needs his own appointed advocate, or does that only come up when the case is contested?", "query_previous": "Voluntary guardianship petition for a child who is a tribal member -- at the hearing, does the judge have to decide anything about separate counsel for the child?", "citation": "MCR 5.404(B)(2)(d)", "gold": ["MCR 5.404(B)(2)(d)"], "also_answered_by": ["MCR 5.404(B)(2)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.08, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "glm-5.2", "checker_note": "The cited subprovision merely lists a factor for the court to consider, but the broader MCR 5.404(B)(2) establishes the mandatory on-the-record hearing requirement that actually answers the question.", "provision": "(d) if a lawyer-guardian ad litem should be appointed to represent the Indian child."}, {"query_id": "mcr-q-B-MCR2.622(B)(5)(e)", "query": "My opponent objected to the court-appointed receiver and now we&#x27;re briefing why the replacement candidate should be chosen. What is the last specific thing the judge has to weigh before ruling on the substitute?", "query_previous": "What must a complaint seeking a receiver specifically address regarding the proposed individual&#x27;s eligibility to serve?", "citation": "MCR 2.622(B)(5)(e)", "gold": ["MCR 2.622(B)(5)(e)"], "also_answered_by": ["MCR 2.622(B)(5)(f)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.056, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Query asks for &#x27;the last specific thing the judge has to weigh,&#x27; but the factor list ends at MCR 2.622(B)(5)(f) (&#x27;any other factor the court deems appropriate&#x27;), so the question as worded points to (f), not the gold (e); asking for the last enumerated factor is also quiz phrasing no attorney uses.", "provision": "(e) whether the receiver considered for appointment is disqualified under subrule (B)(6); and"}, {"query_id": "mcr-q-B-MCR2.303(A)(1)(b)", "query": "I&#x27;m drafting a petition to perpetuate testimony before any complaint is filed. The client wants to know what the petition has to allege regarding the nature of the dispute we plan to bring and why the client is personally involved.", "query_previous": "My client needs to preserve testimony before filing suit. What do I need to say in the petition about what the future case is about and my client&#x27;s stake in it?", "citation": "MCR 2.303(A)(1)(b)", "gold": ["MCR 2.303(A)(1)(b)"], "also_answered_by": ["MCR 2.303(A)(1)"], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.0, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Same reverse-engineering fault, only reworded: &#x27;the nature of the dispute we plan to bring and why the client is personally involved&#x27; is still a one-to-one gloss on subrule (b)&#x27;s &#x27;subject matter of the expected action and the petitioner&#x27;s interest in it&#x27;, and a drafter would ask what MCR 2.303(A)(1) as a whole requires.", "provision": "(b) he subject matter of the expected action and the petitioner&#x27;s interest in it;"}, {"query_id": "mcr-q-B-MCR3.915(B)(1)(c)", "query": "I&#x27;m in a child protective proceeding and my client is a minor parent on the petition. She wants to proceed without a lawyer, but her mother is pushing back on that. Where is the rule that says the court cannot let her waive counsel if a parent or guardian objects?", "query_previous": "In a juvenile proceeding, can a minor respondent give up their right to counsel if their parent or guardian opposes it?", "citation": "MCR 3.915(B)(1)(c)", "gold": ["MCR 3.915(B)(1)(c)"], "also_answered_by": ["MCR 3.915(A)(3)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.261, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "The child-protective/minor-parent framing does cure the MCR 3.915(A)(3) ambiguity, but the question now recites the holding verbatim (&#x27;the court cannot let her waive counsel if a parent or guardian objects&#x27;), so it is retrievable by string match.", "provision": "(c) The respondent may waive the right to the assistance of an attorney, except that the court shall not accept the waiver by a respondent who is a minor when a parent, guardian, legal custodian, or guardian ad litem objects to the waiver."}, {"query_id": "mcr-q-B-MCR7.203(F)(2)", "query": "My client&#x27;s appeal was dismissed for lack of jurisdiction, and I am preparing a motion asking a three-judge panel to reconsider that dismissal. Do I need to pay an entry fee for this filing?", "query_previous": "Where do I find the deadline for asking an appellate panel to take another look at an order that tosses my appeal for lack of prosecution?", "citation": "MCR 7.203(F)(2)", "gold": ["MCR 7.203(F)(2)"], "also_answered_by": [], "query_type": "cross_reference", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.312, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Query and gold now match, but the leftover co-gold MCR 7.217(D)(1) says nothing about entry fees and covers want-of-prosecution dismissal, so it should be dropped from also_answered_by.", "provision": "(2) The appellant or plaintiff may file a motion for reconsideration within 21 days after the date of the order of dismissal. The motion will be submitted to a panel of three judges. No entry fee is required for a motion filed under this subrule."}, {"query_id": "mcr-q-A-MCR3.965(C)(4)(c)", "query": "Removal hearing this afternoon. The department wants out of the efforts showing based on the mother&#x27;s older child, whose case ended with her signing away her rights rather than a judge cutting them off over her objection. Does a prior case in that posture count as one of the listed triggers?", "query_previous": "Removal hearing. The mother&#x27;s rights to an older child were taken away against her wishes in an earlier case. Does that fact alone excuse the department from showing it tried to avoid removal?", "citation": "MCR 3.965(C)(4)(c)", "gold": ["MCR 3.965(C)(4)(c)"], "also_answered_by": ["MCR 3.965(C)(4)", "MCR 3.965(C)(5)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.036, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "glm-5.2", "checker_note": "The question asks whether a voluntary relinquishment counts as a listed trigger, but the labelled provision (C)(4)(c) only defines &#x27;involuntary&#x27; termination; the answer relies on reading the introductory text of MCR 3.965(C)(4) to know what the listed triggers are.", "provision": "(c) parental rights of the parent with respect to a sibling have been terminated involuntarily; or"}, {"query_id": "mcr-q-A-MCR8.203", "query": "District court clerk here. What governs the case records I have to keep and the reports I have to send up? Is there a standard written just for district courts, or do I follow the same one the other courts use?", "query_previous": "District court clerk asking: what sets the requirements for the case records I keep and the reports I have to make?", "citation": "MCR 8.203", "gold": ["MCR 8.203"], "also_answered_by": ["MCR 8.202", "MCR 8.204"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "needs_revision", "echo": 0.278, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "glm-5.2", "checker_note": "While MCR 8.203 technically answers the question by stating that district courts follow the rules in MCR 8.119, MCR 8.119 is the primary provision that actually prescribes the specific records and reports, making it an unmarked co-valid answer.", "provision": "The clerk of every district court shall maintain court records and make reports as prescribed by MCR 8.119."}, {"query_id": "mcr-q-B-MCR3.974(D)", "query": "My file is open and my client was just adjudicated; the judge is sending the child to live outside the home. I need to pull up the subrule that sets up the sequence of steps for the judge to follow after that removal happens.", "query_previous": "I&#x27;m looking for the step-by-step process the juvenile court has to follow once a child has already been removed from the home and placed somewhere else after the adjudication. Which subrule lays out that procedure?", "citation": "MCR 3.974(D)", "gold": ["MCR 3.974(D)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.143, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Fault not repaired: the query is still a paraphrase of the subrule heading (&#x27;sequence of steps for the judge to follow after that removal&#x27; = &#x27;Procedure Following Postadjudication Out-of-Home Placement&#x27;) and the gold block is still only the stem, so the item remains findable by heading match alone.", "provision": "(D) Procedure Following Postadjudication Out-of-Home Placement. If the child is in placement under subrule (B)(2) or (C)(3)(b), the court shall proceed as follows:"}, {"query_id": "mcr-q-B-MCR7.212(C)(6)(c)", "query": "I&#x27;m drafting the appendix-proof portion of a Court of Appeals brief and need the rule requiring us to set out the nature of the evidentiary submissions with enough particularity that the reader can follow the narrative, while simultaneously flagging the factual disagreements versus the matters the parties treat as established. Which subitem governs that disclosure?", "query_previous": "What is the statement on appeal where I lay out enough of the evidence summary to be understandable, and clarify which factual points the parties actually contest versus what&#x27;s already settled?", "citation": "MCR 7.212(C)(6)(c)", "gold": ["MCR 7.212(C)(6)(c)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.032, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "&#x27;Appendix-proof portion&#x27; is fabricated jargon (MCR 7.212(C)(6) is the statement of facts, not an appendix) and the query still tracks the leaf&#x27;s wording clause-for-clause, so the original paraphrase fault was moved rather than fixed.", "provision": "(c) the substance of proof in sufficient detail to make it intelligible, indicating the facts that are in controversy and those that are not;"}, {"query_id": "mcr-q-B-MCR7.104(E)(5)", "query": "I&#x27;m assembling the appeal of right packet for a circuit court final order. The trial transcript won&#x27;t be ready for a couple of weeks, so I want to file proof that we ordered it and paid. If I do that, how long do we have to file the reporter&#x27;s certificate once the order is placed?", "query_previous": "We&#x27;re putting together the appeal of right packet and the trial transcript won&#x27;t be ready for a couple of weeks. I can file a placeholder showing we paid for it, but how long do we have to get the reporter&#x27;s actual certificate back to the court after the order goes in?", "citation": "MCR 7.104(E)(5)", "gold": ["MCR 7.104(E)(5)"], "also_answered_by": ["MCR 7.109(B)(3)(a)"], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.16, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "New defect: MCR 7.104 is in Subchapter 7.100 (Appeals to Circuit Court) and governs an appeal of right TO circuit court from a district court or agency, so &#x27;the appeal of right packet for a circuit court final order&#x27; points at the wrong court (that would be MCR 7.204); change to a district court or agency final order.", "provision": "(5) unless there is nothing to be transcribed, the certificate of the court reporter or recorder or a statement that the transcript has been ordered and payment for it made or secured. If a statement is filed, the certificate of the court reporter or recorder must be filed within 7 days after a transcript is ordered by a party or the court."}, {"query_id": "mcr-q-B-MCR3.963(B)(4)", "query": "I&#x27;m preparing the paperwork for the state agency to get a judge to sign off on keeping a youth at a safe house right after a police officer picks them up on the street. What rule dictates what the department has to file to get that immediate authorization, and what the signed directive must include?", "query_previous": "What&#x27;s the procedure for getting an emergency order from the court placing a child with DHHS when an officer already took the child into protective custody without a prior court order?", "citation": "MCR 3.963(B)(4)", "gold": ["MCR 3.963(B)(4)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.12, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Verbatim trigger clause is gone, but the euphemisms used to hide it (&#x27;keeping a youth at a safe house&#x27;, &#x27;picks them up on the street&#x27;) are not terms any child-welfare practitioner would use for DHHS protective custody and placement.", "provision": "(4) Ex parte Placement Order. If an officer has taken a child into protective custody without court order under subrule (A), or if the Department of Health and Human Services is requesting the court grant it protective custody and placement authority, the Department of Health and Human Services shall present to the court a petition or affidavit of facts and request a written ex parte placement order. If a judge finds all the factors in subrule (B)(1)(a)-(e) are present, the judge may issue a placement order; if a referee finds all the factors in subrule (B)(1)(a)-(e) are present, the referee may issue an interim placement order pending a preliminary hearing. The written order shall contain specific findings of fact. It shall be communicated, electronically or otherwise, to the Department of Health and Human Services."}, {"query_id": "mcr-q-B-MCR4.003", "query": "I am drafting a timeline for this matter and need to know if the May 8, 1997 repeal of the rule regarding transfers from circuit court to district court took effect before July 1, 1997.", "query_previous": "Can I still move to transfer my case down from the circuit court to district court?", "citation": "MCR 4.003", "gold": ["MCR 4.003"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.062, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "The rewritten query recites both dates from the one-line repeal note and asks whether May 8, 1997 took effect before July 1, 1997, which is self-answering, string-matchable and a question no practitioner would ever ask.", "provision": "[Repealed May 8, 1997, effective July 1, 1997 - Reporter.]"}, {"query_id": "mcr-q-B-MCR7.305(C)(1)(a)", "query": "I&#x27;m reviewing the timeline for bypassing the Court of Appeals and applying directly to the Supreme Court. I know there&#x27;s a specific trigger if the intermediate appellate court is already seized of the matter — something about the 42-day application deadline starting once the initial pleading is submitted to the Court of Appeals. Which subrule establishes that specific filing as the trigger event?", "query_previous": "I&#x27;m looking for the provision that says one route to the Court of Appeals on leave is when a party has already taken a direct appeal there.", "citation": "MCR 7.305(C)(1)(a)", "gold": ["MCR 7.305(C)(1)(a)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.067, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Legal error fixed and the (C)(1) stem co-listed, but the query now hands over the whole answer (42 days, triggered by the filing in the Court of Appeals) and closes with exam phrasing &#x27;Which subrule establishes that specific filing as the trigger event?&#x27;.", "provision": "(a) a claim of appeal is filed in the Court of Appeals;"}, {"query_id": "mcr-q-B-MCR7.210(B)(1)(b)", "query": "After filing a motion for summary disposition, how many days does the opposing party have to file a response under the court rules?", "query_previous": "What is the legal standard for establishing the elements of a breach of contract claim when seeking damages in a Michigan circuit court?", "citation": "MCR 7.210(B)(1)(b)", "gold": [], "also_answered_by": ["MCR 2.116(G)(1)(a)(ii)"], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.2, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "The duplicate template is gone, but the replacement is no longer unanswerable: MCR 2.116(G)(1)(a)(ii) is in the corpus and gives the summary-disposition response deadline, so a correct retrieval would be scored wrong against gold=[].", "provision": "(b) In an appeal from probate court in an estate or trust proceeding, an adult or minor guardianship proceeding under the Estates and Protected Individuals Code, or a proceeding under the Mental Health Code, only that portion of the transcript concerning the order appealed from need be filed. The appellee may file additional portions of the transcript."}, {"query_id": "mcr-q-B-MCR3.921(D)(1)(a)", "query": "I&#x27;m preparing the summons in a parental-rights termination case and the file only lists the mother. What basic biographical information about the youth must I put on the summons if I have it?", "query_previous": "I&#x27;m drafting the notice for this juvenile matter. What identifying details about the minor and the parents do I need to include if I have them?", "citation": "MCR 3.921(D)(1)(a)", "gold": ["MCR 3.921(D)(1)(a)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.062, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "MCR 3.921(D) governs the NOTICE served on a putative father, not a summons, and the co-gold MCR 3.920(B)(3) content list contains no biographical data at all, so the rewritten &#x27;what goes on the summons&#x27; framing is answered by neither provision.", "provision": "(a) if known, the name of the child, the name of the child&#x27;s mother, and the date and place of birth of the child;"}, {"query_id": "mcr-q-B-MCR2.205(B)", "query": "If an indispensable party resides outside the state and will not consent to the court&#x27;s jurisdiction, what is the statutory limit on the number of days the plaintiff has to serve an alias summons before the case is dismissed?", "query_previous": "What is the maximum amount of damages a plaintiff can recover in a small claims case?", "citation": "MCR 2.205(B)", "gold": [], "also_answered_by": ["MCR 2.102(D)", "MCR 2.102(E)(1)"], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.1, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Labeled unanswerable, but MCR 2.102(D) (summons/second summons expires 91 days after issuance) plus MCR 2.102(E)(1) (action deemed dismissed on expiration) squarely answer the days-to-serve-before-dismissal question.", "provision": "(B) Effect of Failure to Join. When persons described in subrule (A) have not been made parties and are subject to the jurisdiction of the court, the court shall order them summoned to appear in the action, and may prescribe the time and order of pleading. If jurisdiction over those persons can be acquired only by their consent or voluntary appearance, the court may proceed with the action and grant appropriate relief to persons who are parties to prevent a failure of justice. In determining whether to proceed, the court shall consider"}, {"query_id": "mcr-q-B-MCR3.965(C)(7)(a)", "query": "I&#x27;m looking for the juvenile placement rule that says the court has to allow each parent frequent contact with their kid unless parental rights are suspended under that pending termination statute or the child has a guardian or legal custodian.", "query_previous": "Where do I find the juvenile court rule from the preliminary hearing stage that creates the default right to regular contact with a child who&#x27;s been removed from the home, subject to exceptions for supervised visits being dangerous or a prior termination of parental rights?", "citation": "MCR 3.965(C)(7)(a)", "gold": ["MCR 3.965(C)(7)(a)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.435, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Exceptions are now accurate but the query recites the operative sentence and both carve-outs almost verbatim (&#x27;each parent frequent contact&#x27;, &#x27;guardian or legal custodian&#x27;), and it still misstates the first carve-out as suspension of parental rights rather than of parenting time.", "provision": "(a) Unless the court suspends parenting time pursuant to MCL 712A.19b(4), or unless the child has a guardian or legal custodian, the court must permit each parent frequent parenting time with a child in placement unless parenting time, even if supervised, may be harmful to the child."}, {"query_id": "mcr-q-B-MCR2.403(H)(5)(a)", "query": "I&#x27;m looking at the case evaluation scheduling order, and my client&#x27;s hearing got pushed back. I need the specific subsection that tells me the already-paid evaluation money carries over to the continued date instead of being returned.", "query_previous": "Where do I find the rule on what happens to case evaluation fees when the conference gets postponed and rescheduled?", "citation": "MCR 2.403(H)(5)(a)", "gold": ["MCR 2.403(H)(5)(a)"], "also_answered_by": ["MCR 2.403(H)(5)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.174, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Parent co-gold is now marked, but the rewrite buys precision by paraphrasing (a) in full (&#x27;money carries over to the continued date instead of being returned&#x27; = &#x27;the fees are applied to the new date&#x27;), leaving nothing to reason about.", "provision": "(a) in the case of an adjournment, the adjournment order sets a new date for case evaluation and the fees are applied to the new date, or"}, {"query_id": "mcr-q-B-MCR3.921(B)(2)(a)", "query": "I&#x27;m assembling the notice list for a juvenile disposition review hearing. I know one of the required recipients is the department or agency that has physical custody and is supervising the child, but I cannot remember if that recipient is spelled out under the dispositional orders subsection or the post-disposition review subsection. Which rule fragment names that specific recipient?", "query_previous": "Which entity tasked with overseeing a minor&#x27;s placement is explicitly listed among those who must get notice in a juvenile proceeding?", "citation": "MCR 3.921(B)(2)(a)", "gold": ["MCR 3.921(B)(2)(a)"], "also_answered_by": ["MCR 3.921(B)(2)(b)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.069, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Fault not repaired and aggravated: &#x27;Which rule fragment names that specific recipient?&#x27; plus the invented &#x27;I cannot remember if it is under the dispositional orders subsection or the post-disposition review subsection&#x27; is pure benchmark phrasing, and the description &#x27;department or agency that has physical custody and is supervising the child&#x27; straddles gold (a) and sibling (b) (&#x27;the person or institution having court-ordered custody&#x27;).", "provision": "(a) the agency responsible for the care and supervision of the child,"}, {"query_id": "mcr-q-A-MCR7.212(H)(2)(e)", "query": "Criminal appeal pending in the Court of Appeals, and the State Appellate Defender Office wants to come in as amicus supporting my client. Do they have to file a motion asking permission first, or can they just file the brief?", "query_previous": "Does the state appellate defender have to move for leave before filing a friend-of-the-court brief in the intermediate appellate court?", "citation": "MCR 7.212(H)(2)(e)", "gold": ["MCR 7.212(H)(2)(e)"], "also_answered_by": ["MCR 7.208", "MCR 7.209"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.174, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "glm-5.2", "checker_note": "The cited provision merely lists who may file an amicus brief, but does not state the procedural requirement for obtaining permission; MCR 7.316 governs amicus briefs in the Court of Appeals and answers the question better.", "provision": "(e) on behalf of the State Appellate Defender Office as permitted by law; or"}, {"query_id": "mcr-q-A-MCR9.115(F)(5)(c)", "query": "The administrator and my client have agreed on a sanction and the paperwork is now sitting with the panel. Is the panel boxed into signing off or turning it down, or can it come back to us with its concerns before it decides anything?", "query_previous": "Consent discipline stipulation is now on file with the hearing panel. What is the panel allowed to do with it at that point?", "citation": "MCR 9.115(F)(5)(c)", "gold": ["MCR 9.115(F)(5)(c)"], "also_answered_by": ["MCR 9.115(F)(5)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.053, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "glm-5.2", "checker_note": "The cited text is merely the introductory clause for the entire subsection; the specific options available to the panel (such as requesting additional information) are actually listed in the subsequent subdivisions of MCR 9.115(F)(5), making the broader citation the correct target.", "provision": "(c) Upon filing of a stipulation for a consent order of discipline, the hearing panel may:"}, {"query_id": "mcr-q-B-MCR3.216(H)(3)(c)", "query": "In a domestic relations action, what financial disclosure must each party include in the written statement submitted to the mediator before the session?", "query_previous": "When an evaluator is drafting the summary report for a domestic relations mediation, what property details must be included if they can be tracked down without much trouble?", "citation": "MCR 3.216(H)(3)(c)", "gold": ["MCR 3.216(H)(3)(c)"], "also_answered_by": ["MCR 3.216(H)(3)(d)"], "query_type": "disambiguation", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.0, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Actor and document are fixed, but &#x27;what financial disclosure must each party include&#x27; is now ambiguous between (c) (marital assets and values) and the unmarked (d) (income and expenses of the parties); the query must name valuation of assets.", "provision": "(c) a description of the marital assets and their estimated value, where such information is appropriate and reasonably ascertainable;"}, {"query_id": "mcr-q-B-MCR3.230(E)(1)", "query": "Where does it say the IV-D agency can serve a notice proposing the support obligation right after the complaint gets filed or once paternity is established, and that the notice has to include the effective date and the facts relied on for the calculation?", "query_previous": "What rule says the friend of the court can send a suggested child support amount when the case starts or after paternity is established, and explains what paperwork has to go with it?", "citation": "MCR 3.230(E)(1)", "gold": ["MCR 3.230(E)(1)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.571, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "IV-D attribution fixed, but the rewrite now tracks the text almost clause for clause (&#x27;right after the complaint gets filed or once paternity is established&#x27; / &#x27;effective date and the facts relied on for the calculation&#x27;), making it lexically findable.", "provision": "(1) At the time that a complaint is filed, or any time after establishing paternity or a duty to support a child, the IV-D agency may provide notice setting a proposed support amount. The proposed support obligation shall be calculated by application of the Michigan Child Support Formula or a properly documented deviation from the amount calculated using the formula.  The notice or an accompanying calculation results report must state the amounts calculated for support, the proposed effective date, and the facts and assumptions upon which the calculation is based."}, {"query_id": "mcr-q-B-MCR2.106(D)(2)", "query": "I have a publication order going out next week. My client swears he has no idea where the other side lives and I don&#x27;t want to waste time tracking down an address if it&#x27;s not strictly necessary. Which subrule tells me I can skip the mailing step if I&#x27;ve made a solid effort to locate them, and clarifies whose job it is to handle the physical mailing and get the receipt back to the court?", "query_previous": "I&#x27;m trying to recall the rule that says the moving party has to arrange and prove the mailing when serving an order by publication, and that the mailing requirement drops if the plaintiff can&#x27;t track down the defendant&#x27;s address after a diligent search.", "citation": "MCR 2.106(D)(2)", "gold": ["MCR 2.106(D)(2)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.125, "regenerated": true, "review_stratum": "failed-after-rewrite", "checker": "claude", "checker_note": "Same two-clause fingerprint of the block, only paraphrased (&#x27;solid effort to locate them&#x27; = &#x27;diligent inquiry&#x27;; &#x27;whose job it is to handle the physical mailing and get the receipt back&#x27; = &#x27;the moving party is responsible for arranging for the mailing and proof of mailing&#x27;), so the reveal fault was moved, not repaired.", "provision": "(2) sending a copy of the order to the defendant at his or her last known address by registered mail, return receipt requested, before the date of the last publication. If the plaintiff does not know the present or last known address of the defendant, and cannot ascertain it after diligent inquiry, mailing a copy of the order is not required. The moving party is responsible for arranging for the mailing and proof of mailing."}, {"query_id": "mcr-q-B-MCR3.993(A)(7)(g)", "query": "Building the juvenile appeal transcript and need to confirm the designated contents include the order appointing counsel under the Indian Child Welfare Act and the state juvenile code.", "query_previous": "I&#x27;m putting together the record on appeal for a juvenile case and I&#x27;m trying to find where the court rules list getting a lawyer assigned under the state code and the federal Indian Child Welfare Act as one of the appealable items.", "citation": "MCR 3.993(A)(7)(g)", "gold": ["MCR 3.993(A)(7)(g)"], "also_answered_by": ["MCR 3.993(A)(7)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.056, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "New false premise replaces the old one: MCR 3.993(A) lists orders APPEALABLE BY RIGHT to the Court of Appeals, not &#x27;the designated contents&#x27; of an appeal transcript, so nothing in the gold answers a question about transcript designation.", "provision": "(g) appointment of counsel pursuant to MCL 712B.21 or 25 USC 1912;"}, {"query_id": "mcr-q-B-MCR3.921(B)(1)(h)(i)", "query": "In a termination of parental rights proceeding for an Indian child, which notice recipients are required to be included in the placement order if the tribe&#x27;s identity is unknown?", "query_previous": "In a juvenile case involving an Indian child, who has to get notice if we can&#x27;t figure out which specific tribal nation the kid belongs to?", "citation": "MCR 3.921(B)(1)(h)(i)", "gold": ["MCR 3.921(B)(1)(h)(i)"], "also_answered_by": ["MCR 3.920(C)(2)", "MCR 3.921(A)(1)(g)(i)", "MCR 3.921(B)(3)", "MCR 3.921(C)(8)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.133, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Rewrite introduced two false premises: MCR 3.921(B)(1) governs who is notified of each hearing, not who is &#x27;included in the placement order&#x27;, and the &#x27;termination of parental rights proceeding&#x27; framing points to MCR 3.921(B)(3) (which routes Indian-child notice to MCR 3.920(C)(1)) rather than to (B)(1)(h)(i).", "provision": "(i) the child’s tribe and, if the tribe is unknown, the Secretary of the Interior, and"}, {"query_id": "mcr-q-B-MCR2.401(J)(1)(a)", "query": "I&#x27;m prepping for the early conference on electronically stored information and need the rule list item that tells us to tackle data retention issues and agree on a protocol for safeguarding relevant digital files.", "query_previous": "Which scheduling order provision lets the court address a litigation hold protocol for electronic files?", "citation": "MCR 2.401(J)(1)(a)", "gold": ["MCR 2.401(J)(1)(a)"], "also_answered_by": ["MCR 2.401(J)(1)(e)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.143, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "ESI-conference framing is fixed and MCR 2.401(B)(2)(c) is marked, but MCR 2.401(J)(1)(e) (&#x27;implementation of a preservation plan for potentially relevant ESI&#x27;) answers the &#x27;agree on a protocol for safeguarding relevant digital files&#x27; half and is still unmarked.", "provision": "(a) any issues relating to preservation of discoverable information, including adoption of a preservation plan for potentially relevant ESI;"}, {"query_id": "mcr-q-B-MCR9.234(B)(1)", "query": "A witness failed to obey a subpoena issued by the Judicial Tenure Commission. If we want to pursue a contempt action against this nonparty, in which counties can we bring the proceeding?", "query_previous": "If an uncooperative third-party witness ignores a trial subpoena, where can I initiate the contempt action?", "citation": "MCR 9.234(B)(1)", "gold": ["MCR 9.234(B)(1)"], "also_answered_by": [], "query_type": "disambiguation", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.353, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Query and gold are sound, but co-gold MCR 2.506(E)(1) answers the venue question differently (&#x27;the court in which the action is pending&#x27;) and should be dropped from also_answered_by.", "provision": "(1) Contempt proceedings against a nonparty for failure to obey a subpoena issued pursuant to this rule may be brought pursuant to MCR 2.506(E) in the circuit court for the county in which the individual resides, in which the individual is found, in which the contempt occurred, or in which the hearing is to be held."}, {"query_id": "mcr-q-B-MCR3.207(B)(6)", "query": "If the opposing party files a timely written objection to an emergency ex parte child support order, am I still bound to comply with the temporary custody arrangement while the dispute is pending?", "query_previous": "Is a corporate party required to pay the fee schedule cost of a private special or judicial appointee for a deposition, and is that cost taxable as an allowable expense to the prevailing party?", "citation": "MCR 3.207(B)(6)", "gold": [], "also_answered_by": [], "query_type": "unanswerable", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.5, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Item is labeled query_type=unanswerable with gold=[], but the rewrite swapped in a query that MCR 3.207(B)(6) squarely answers (&#x27;Even if an objection or motion is filed, the ex parte order will remain in effect and must be obeyed&#x27;), destroying the unanswerable label instead of fixing the stilted phrasing.", "provision": "(6) An ex parte order providing for child support, custody, or parenting time pursuant to MCL 722.27a, must include the following notice:\n\n“Notice:\n\n1. You may file a written objection to this order or a motion to modify or rescind this order. You must file the written objection or motion with the clerk of the court within 14 days after you were served with this order. You must serve a true copy of the objection or motion on the friend of the court and the party who obtained the order.\n\n2. If you file a written objection, the friend of the court must notify the court to cancel any evidentiary hearing date specified in the ex parte order and try to resolve the dispute. If the friend of the court cannot resolve the dispute, the friend of the court must provide you with form pleadings and written instructions if you wish to bring the matter before the court without the assistance of counsel, and must reschedule the cancelled evidentiary hearing or schedule a hearing with the court.\n\n3. The ex parte order will automatically become a temporary order if you do not file a written objection or motion to modify or rescind the ex parte order. If an evidentiary hearing date is specified in the ex parte order and you do not file a written objection or motion, a hearing will take place on the specified date. If an evidentiary hearing date is specified in the ex parte order and you file a motion, a hearing will take place on the specified date. Even if an objection or motion is filed, the ex parte order will remain in effect and must be obeyed unless changed by a later court order.”\n\nIn all other cases, the ex parte order must state that it will automatically become a temporary order if the other party does not file a written objection or motion to modify or rescind the ex parte order and a request for a hearing. The written objection or motion and the request for a hearing must be filed with the clerk of the court, and a true copy provided to the friend of the court and the other party, within 14 days after the order is served."}, {"query_id": "mcr-q-B-MCR8.110(C)(6)(c)(1)", "query": "I&#x27;m looking at the chief judge&#x27;s quarterly report on case delay, and I need to find the specific exclusion that says the time between when a warrant is issued and when the defendant is arraigned does not count toward the delay calculation.", "query_previous": "I need to find the chief judge rule that defines the time period after a juvenile warrant is signed but before the kid actually goes in front of the judge for the first time.", "citation": "MCR 8.110(C)(6)(c)(1)", "gold": ["MCR 8.110(C)(6)(c)(1)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.286, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Adult framing fixed, but the query now recites the whole leaf (&#x27;time between when a warrant is issued and when the defendant is arraigned&#x27;); string match alone finds it.", "provision": "(1) between the time a preadjudication warrant is issued and a defendant is arraigned;"}, {"query_id": "mcr-q-B-MCR7.108(C)(2)(f)", "query": "My client&#x27;s appeal bond in a criminal case was just approved by the circuit court. I&#x27;m reviewing the conditions of release to make sure he doesn&#x27;t inadvertently violate any terms and get remanded. One of the standing obligations is keeping the court informed if he relocates. What specific mode of communication does the rule require for providing the trial court clerk with his new residential location?", "query_previous": "My client is moving next week while the appeal is pending. Who do I need to inform about the new mailing address, and does a phone call to the court suffice, or do I need to put it in writing?", "citation": "MCR 7.108(C)(2)(f)", "gold": ["MCR 7.108(C)(2)(f)"], "also_answered_by": [], "query_type": "procedural", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.088, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "The query turns on the required mode of notice, and co-gold MCR 7.209(F)(2)(f) omits the words &#x27;in writing&#x27; entirely, so it cannot answer and should be dropped.", "provision": "(f) to notify the trial court clerk in writing of a change of address; and"}, {"query_id": "mcr-q-A-MCR2.313(A)(6)", "query": "My motion to compel is on for Friday. No discovery order has ever been entered in this case, so there&#x27;s nothing yet for them to have disobeyed. At that hearing can the judge go past ordering answers and costs -- say, bar them from supporting a defense -- or do I have to wait until they ignore whatever she signs?", "query_previous": "Won a motion to compel. Is the court stuck with ordering the answers and costs, or can it go further and hit their claims?", "citation": "MCR 2.313(A)(6)", "gold": ["MCR 2.313(A)(6)"], "also_answered_by": ["MCR 2.313(B)(2)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "needs_revision", "echo": 0.038, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "The question is answerable by this provision, but MCR 2.313(B)(2) lists the specific sanctions referenced (including barring a defense) and is a more direct answer to the user&#x27;s specific inquiry.", "provision": "(6) Additional Sanctions. The court in which the action is pending may order such sanctions as are just. Among others, it may take an action authorized under subrule (B)(2)(a), (b), and (c)."}, {"query_id": "mcr-q-B-MCR6.009(D)", "query": "I need the rule on minimizing physical restraints on a defendant in the courtroom - the one that says the judge has to pick the lightest option that still keeps things secure and should think about how visible the shackles are and how much they limit movement.", "query_previous": "I remember there&#x27;s a court rule saying judges have to use the least restrictive option when shackling a defendant in the courtroom, and that they should weigh whether the jury can see the restraints. Where is that?", "citation": "MCR 6.009(D)", "gold": ["MCR 6.009(D)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.125, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Fault only synonym-swapped: &#x27;lightest option that still keeps things secure&#x27; = &#x27;least restrictive means necessary to maintain the security of the courtroom&#x27; and &#x27;how visible the shackles are and how much they limit movement&#x27; = &#x27;visibility of a given restraint and the degree to which it affects an individual&#x27;s range of movement&#x27;.", "provision": "(D) If the court determines restraints are needed, the court must order restraints that reflect the least restrictive means necessary to maintain the security of the courtroom. A court should consider the visibility of a given restraint and the degree to which it affects an individual’s range of movement. A court may consider, but is not limited to considering, participation by video or other electronic means; the presence of court personnel, law enforcement officers, or bailiffs; or unobtrusive stun devices."}, {"query_id": "mcr-q-B-MCR6.401", "query": "I have a file where the client wants the judge alone to decide the case instead of a panel of laypeople, and I need to confirm the basic rule establishing that the client has that option — provided the prosecution signs off and the bench agrees.", "query_previous": "Which rule covers a defendant giving up their right to a jury trial in a criminal case, and what approvals are needed for that?", "citation": "MCR 6.401", "gold": ["MCR 6.401"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.0, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Repair is sound and MCR 6.402(B) is now co-marked, but &#x27;a panel of laypeople&#x27; is not how any attorney phrases a jury waiver question; rephrase to bench trial.", "provision": "The defendant has the right to be tried by a jury, or may, with the consent of the prosecutor and approval by the court, elect to waive that right and be tried before the court without a jury."}, {"query_id": "mcr-q-A-MCR3.921(B)(1)(h)", "query": "Abuse and neglect file where nothing confirms the child&#x27;s tribal membership yet, but there are real indications of it. Does the list of people who must be told about each hearing expand now, or only once membership is actually verified?", "query_previous": "Abuse and neglect docket, and we&#x27;ve now got reason to think the child is a tribal member. Does the standard hearing-notice list in the child protective rules still control who gets told?", "citation": "MCR 3.921(B)(1)(h)", "gold": ["MCR 3.921(B)(1)(h)"], "also_answered_by": ["MCR 3.905"], "query_type": "disambiguation", "arm": "A", "generator": "claude", "status": "needs_revision", "echo": 0.0, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "The question is fully answerable by this provision, but MCR 3.905 is explicitly cited as the source of the actual notice provisions being triggered, making it a co-valid answer that should be marked.", "provision": "(h) in accordance with the notice provisions of MCR 3.905, if the court knows or has reason to know the child is an Indian child:"}, {"query_id": "mcr-q-A-MCR6.425(A)(1)(f)", "query": "Sentencing in three weeks and the report from probation says nothing about what the complainant went through or what she is out of pocket. She never turned in a statement of her own. Is that subject optional when the victim stays silent, or is it required content either way?", "query_previous": "Does the probation officer&#x27;s presentence writeup have to address what the victim lost and what she needs paid back, or does that only come in if she submits her own statement?", "citation": "MCR 6.425(A)(1)(f)", "gold": ["MCR 6.425(A)(1)(f)"], "also_answered_by": ["MCR 6.425(A)", "MCR 6.425(B)"], "query_type": "cross_reference", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.043, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "The provision lists required sentencing information but does not specify whether the probation officer must include victim impact information when the victim is silent or fails to submit a statement.", "provision": "(f) information concerning the financial, social, psychological, or physical harm suffered by any victim of the offense, including the restitution needs of the victim,"}, {"query_id": "mcr-q-A-MCR3.993(D)(2)(b)", "query": "Delinquency case. My client is indigent and has just asked for a lawyer to handle the appeal. On the neglect docket the court gets counsel appointed within 14 days of the request. Does his appointment run on that same 14-day track, or does it get routed somewhere else?", "query_previous": "Respondent in a delinquency case asked for appointed appellate counsel. It isn&#x27;t a child protective matter - how does the court make that appointment?", "citation": "MCR 3.993(D)(2)(b)", "gold": ["MCR 3.993(D)(2)(b)"], "also_answered_by": ["MCR 3.993(D)(5)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.0, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "The labelled provision is merely a cross-reference directing the reader to subrule (D)(5), which actually contains the answer to the question.", "provision": "(b) in all other proceedings subject to this rule, appoint an attorney as provided in subrule (D)(5)."}, {"query_id": "mcr-q-B-MCR2.116(D)(2)", "query": "If I want to challenge the other side&#x27;s case because there&#x27;s no genuine issue of material fact, do I have to put that in my first response, or can I wait and raise it later?", "query_previous": "I need the rule that says you have to bring up certain defenses to a summary judgment motion in your first reply or else you waive them, but also mentions you can amend that reply under the general pleading rules. Which subrule covers the timing for raising those specific defenses?", "citation": "MCR 2.116(D)(2)", "gold": ["MCR 2.116(D)(2)"], "also_answered_by": ["MCR 2.116(D)(4)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "rejected", "echo": 0.059, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "The rewrite introduces a factual error: &#x27;no genuine issue of material fact&#x27; is ground (C)(10), whose timing is governed by MCR 2.116(D)(4) (&#x27;may be raised at any time&#x27;), not by (D)(2), which covers (C)(5), (6), and (7).", "provision": "(2) The grounds listed in subrule (C)(5), (6), and (7) must be raised in a party&#x27;s responsive pleading, unless the grounds are stated in a motion filed under this rule prior to the party&#x27;s first responsive pleading. Amendment of a responsive pleading is governed by MCR 2.118."}, {"query_id": "mcr-q-B-MCR5.125(C)(29)(c)", "query": "I&#x27;m filing a petition to approve a trust and need to serve all interested parties. The client has a signed financial POA, but there&#x27;s no conservator on board. Where in the court rules do I find the list of who must get notice for this type of proceeding?", "query_previous": "In a guardianship or conservatorship proceeding, where do I find the list of interested persons? I need to confirm whether an agent acting under a durable financial power of attorney qualifies, specifically in situations where no conservator has been appointed.", "citation": "MCR 5.125(C)(29)(c)", "gold": ["MCR 5.125(C)(29)(c)"], "also_answered_by": ["MCR 5.125(C)(29)"], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.045, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Query asks where to find &#x27;the list of who must get notice&#x27;, which is the parent MCR 5.125(C)(29); the leaf (c) is one entry and should at most be co-gold with the parent.", "provision": "(c) if there is no conservator, a person named as attorney in fact under a durable power of attorney,"}, {"query_id": "mcr-q-B-MCR2.119(B)(1)(b)", "query": "Where in the court rules does it say that an affidavit filed in support of a motion must set out with particularity the admissible factual evidence establishing the grounds stated in the motion?", "query_previous": "I&#x27;m looking for the rule that says a motion has to lay out the specific, admissible factual basis supporting or opposing the grounds for the request.", "citation": "MCR 2.119(B)(1)(b)", "gold": ["MCR 2.119(B)(1)(b)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.5, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Target was corrected to affidavits, but the query now quotes the leaf almost word for word (&#x27;set out with particularity the admissible factual evidence establishing the grounds stated in the motion&#x27;), making it a pure string match.", "provision": "(b) state with particularity facts admissible as evidence establishing or denying the grounds stated in the motion; and"}, {"query_id": "mcr-q-B-MCR5.125(C)(4)(f)", "query": "I am looking at the list of interested persons for a surety&#x27;s petition to be discharged from further liability. I know the list includes the protected person and the people who would presumptively take from them, but I need to find that specific subsection to confirm the other required parties. Which rule item lists those two categories?", "query_previous": "In a conservatorship, does the definition of interested persons include the individuals who are expected to inherit from the incapacitated adult?", "citation": "MCR 5.125(C)(4)(f)", "gold": ["MCR 5.125(C)(4)(f)"], "also_answered_by": [], "query_type": "known_item", "arm": "B", "generator": "glm-5.2", "status": "needs_revision", "echo": 0.069, "regenerated": true, "review_stratum": "disputed", "checker": "claude", "checker_note": "Posture is now correct, but the query recites (f)&#x27;s exact content (&#x27;protected person and the people who would presumptively take from them&#x27;) and then asks which item lists those two categories, and it is internally incoherent (says it needs &#x27;the other required parties&#x27; yet asks about the two already named).", "provision": "(f) protected person and presumptive heirs of the protected person in a conservatorship, and"}, {"query_id": "mcr-q-A-MCR2.313(A)(2)(b)(iv)", "query": "Served a demand months ago to walk through the defendant&#x27;s warehouse and photograph the loading dock. They have never told us whether they&#x27;ll let us in -- no agreement, no objection, nothing. Can I move to compel on that, or is that motion reserved for unanswered deposition questions and interrogatories?", "query_previous": "Sent over a request to produce documents months ago and got nothing back -- no response, no objection. Is a motion to compel the right vehicle?", "citation": "MCR 2.313(A)(2)(b)(iv)", "gold": ["MCR 2.313(A)(2)(b)(iv)"], "also_answered_by": ["MCR 2.313(A)(2)(b)", "MCR 2.313(A)(2)(b)(i)"], "query_type": "known_item", "arm": "A", "generator": "claude", "status": "needs_revision", "echo": 0.0, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "While the labeled provision establishes the right to move to compel for an unresponded inspection request, MCR 2.310 is the primary rule governing the underlying request for inspection and its required response timeframe, making it a highly probable co-valid target.", "provision": "(iv) in response to a request for inspection submitted under MCR 2.310, a person fails to respond that inspection will be permitted as requested, or"}, {"query_id": "mcr-q-A-MCR3.602(J)(2)(b)", "query": "Drafting a motion to set aside an arbitration award. One of the party-appointed arbitrators was plainly slanted toward the side that picked him, and separately I think the panel behaved in a way that hurt my client&#x27;s case. Does the bias ground reach every arbitrator on the panel or only one of them depending on how he got there, and does that same limit apply to the ground based on how the panel behaved?", "query_previous": "Found out after the award that the neutral arbitrator had an undisclosed financial tie to the other side. Is that something the court must vacate for, or only may?", "citation": "MCR 3.602(J)(2)(b)", "gold": ["MCR 3.602(J)(2)(b)"], "also_answered_by": ["MCR 3.602(J)(1)", "MCR 3.602(J)(2)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "rejected", "echo": 0.097, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "The cited provision only covers evident partiality by a neutral arbitrator, but the question also asks about panel misconduct, which is governed by the broader misconduct clause in the same subsection; the label should be MCR 3.602(J)(2).", "provision": "(b) there was evident partiality by an arbitrator appointed as a neutral, corruption of an arbitrator, or misconduct prejudicing a party’s rights;"}, {"query_id": "mcr-q-A-MCR7.205(A)(4)(b)", "query": "Court of Appeals threw out my claim of appeal for lack of jurisdiction, I moved for reconsideration of that dismissal, and the reconsideration was denied last week. The ordinary delayed window measured from the underlying trial court order closed months back. Do I still have a way back in, and if so does my clock run from the dismissal itself or from the order denying reconsideration of it?", "query_previous": "Court of Appeals just knocked out my claim of appeal for want of jurisdiction. How long do I have to come back at it by leave instead, and does it have to be the same lower court order?", "citation": "MCR 7.205(A)(4)(b)", "gold": ["MCR 7.205(A)(4)(b)"], "also_answered_by": ["MCR 7.205(A)(4)"], "query_type": "procedural", "arm": "A", "generator": "claude", "status": "needs_revision", "echo": 0.393, "regenerated": true, "review_stratum": "disputed", "checker": "glm-5.2", "checker_note": "The question directly quotes the distinctive phrase &#x27;order denying reconsideration of that order&#x27;, allowing a string match to find the provision without legal understanding.", "provision": "(b) For appeals governed by subrule (A)(1) or (2), if the Court of Appeals dismisses a claim of appeal for lack of jurisdiction, a delayed application for leave to appeal may also be filed within 21 days of the entry of the dismissal order or an order denying reconsideration of that order, provided that:"}, {"query_id": "mcr-q-A-MCR7.105(E)(4)(b)", "query": "Circuit court granted my application for leave from a district court judgment. The docketing paperwork and the service back on the district court still have to happen. Does that clock run from the district court&#x27;s judgment, or from the day the leave order went in, and how long do I get?", "query_previous": "Circuit court just granted leave on my application from a district court order. No claim of appeal is needed, so how quickly must I get the required filings and the service on the lower court done?", "citation": "MCR 7.105(E)(4)(b)", "gold": ["MCR 7.105(E)(4)(b)"], "a
